<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#0C0C18;
  --sur:#13132A;
  --sur2:#1A1A35;
  --bor:#252540;
  --bor2:#2E2E55;
  --txt:#F0EDE8;
  --mut:#6B6B8A;
  --mut2:#9898B8;
  --teal:#4ECDC4;
  --teal2:#38B8AF;
  --amber:#F5A623;
  --amber2:#FFD166;
  --red:#FF6B6B;
  --yel:#FFE66D;
  --grd:linear-gradient(135deg,var(--teal),var(--amber2));
  --grd-subtle:linear-gradient(135deg,color-mix(in srgb,var(--teal) 15%,transparent),color-mix(in srgb,var(--amber2) 8%,transparent));
  --st:env(safe-area-inset-top,0px);
  --sb:env(safe-area-inset-bottom,0px);
  --r:14px;
  --r-sm:10px;
  --shadow:0 4px 24px rgba(0,0,0,.4);
  --shadow-teal:0 4px 20px rgba(78,205,196,.25);
}
body.light{
  --bg:#F0EEF8;--sur:#FFFFFF;--sur2:#F7F6FF;--bor:#E2DFEE;--bor2:#D0CCEA;
  --txt:#1A1830;--mut:#8885A8;--mut2:#6662888;--teal:#2BAF9F;--teal2:#23998A;
  --amber:#D4880A;--amber2:#E8A020;--grd:linear-gradient(135deg,#2BAF9F,#E8A020);
  --grd-subtle:linear-gradient(135deg,color-mix(in srgb,#2BAF9F 12%,transparent),color-mix(in srgb,#E8A020 8%,transparent));
}
html,body{height:100%;background:var(--bg);color:var(--txt);font-family:'Plus Jakarta Sans',-apple-system,sans-serif;overflow:hidden}

/* ── SHELL ── */
#shell{position:fixed;inset:0;display:flex;flex-direction:column;padding-top:var(--st);z-index:1}

/* ── TOPBAR ── */
#topbar{
  flex-shrink:0;padding:14px 16px 0;
  background:var(--bg);
  z-index:2;position:relative;
}
#topbar::after{
  content:'';position:absolute;bottom:0;left:0;right:0;height:1px;
  background:linear-gradient(90deg,transparent,var(--bor2),transparent);
}
.tb-row{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.trip-lbl{
  font-size:9px;letter-spacing:4px;
  background:var(--grd);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
  text-transform:uppercase;margin-bottom:4px;font-weight:700;
}
.trip-nm{
  font-size:22px;font-weight:800;cursor:pointer;
  display:flex;align-items:center;gap:6px;line-height:1.1;
  letter-spacing:-0.5px;
}
.trip-nm:active{opacity:.7}
.bud-box{text-align:right;flex-shrink:0}
.bud-lbl{font-size:9px;color:var(--mut);letter-spacing:1px;text-transform:uppercase}
.bud-val{font-size:16px;font-weight:700;cursor:pointer;letter-spacing:-0.3px}
.prog{margin-top:10px;background:var(--sur2);border-radius:99px;height:5px;overflow:hidden}
.prog-b{height:100%;border-radius:99px;background:var(--grd);transition:width .6s cubic-bezier(.4,0,.2,1)}
.prog-inf{display:flex;justify-content:space-between;margin-top:5px;font-size:10px;color:var(--mut);padding-bottom:10px;font-weight:500}
.chips{display:flex;gap:5px;flex-wrap:wrap;padding:4px 0 8px}
.chip{
  background:var(--sur);border:1px solid var(--bor);border-radius:99px;
  font-size:11px;padding:4px 11px;cursor:pointer;color:var(--mut2);
  font-weight:500;transition:all .15s;
}
.chip:active{transform:scale(.95)}
.chip.on{
  border-color:var(--teal);color:var(--teal);
  background:color-mix(in srgb,var(--teal) 10%,transparent);
  font-weight:600;
}
.chip.add{color:var(--teal);border-style:dashed;border-color:var(--teal2)}

/* ── TABS ── */
#tabs{flex-shrink:0;display:flex;gap:4px;padding:0 16px 10px;background:var(--bg);z-index:2;position:relative}
.tab{
  flex:1;background:var(--sur);border:1px solid var(--bor);border-radius:99px;
  color:var(--mut2);font-size:11px;padding:8px 2px;cursor:pointer;text-align:center;

</style>

<body>

<div id="shell">
  <div id="topbar">
    <div class="tb-row">
      <div>
        <div class="trip-lbl">Controle de Viagem</div>
        <div class="trip-nm" id="tnm"><span id="tnmt">—</span><span style="font-size:13px;opacity:.5">✏️</span></div>
        <div class="chips" id="chips"></div>
      </div>
      <div class="bud-box">
        <div class="bud-lbl">Orçamento</div>
        <div class="bud-val" id="bval">—</div>
        <button id="theme-btn" onclick="toggleTheme()" style="margin-top:6px;background:none;border:none;font-size:18px;cursor:pointer;display:block;margin-left:auto">🌙</button>
      </div>
    </div>
    <div class="prog"><div class="prog-b" id="pb" style="width:0%"></div></div>
    <div class="prog-inf">
      <span>Gasto: <strong id="tv" style="color:var(--teal)">R$ 0</strong></span>
      <span id="rv"></span>
    </div>
  </div>

  <div id="tabs">
    <div class="tab on" data-t="dash">📊</div>
    <div class="tab" data-t="lanc">📋</div>
    <div class="tab" data-t="rot">🗺️ Roteiro</div>
    <div class="tab" data-t="mapa">📍 Mapa</div>
  </div>

  <div id="pages">
    <div class="pg on" id="pg-dash"></div>
    <div class="pg" id="pg-lanc">
      <!-- toolbar: modo + contador -->
      <div class="lanc-toolbar">
        <span id="lc" style="font-size:11px;color:var(--mut2);font-weight:500"></span>
        <div style="display:flex;align-items:center;gap:8px">
          <span id="fcl" style="font-size:11px;color:var(--teal);cursor:pointer;display:none;font-weight:600">Limpar ×</span>
          <div class="lanc-mode">
            <button class="lanc-mode-btn on" id="lm-group" onclick="setLancMode('group')">▤ Grupos</button>
            <button class="lanc-mode-btn" id="lm-list" onclick="setLancMode('list')">≡ Lista</button>
          </div>
        </div>
      </div>
      <!-- filtros por categoria (só na mode lista) -->
      <div class="lanc-cats-filter" id="lanc-filter" style="display:none"></div>
      <!-- conteúdo -->
      <div id="gl"></div>
    </div>
    <div class="pg" id="pg-rot"><div id="rw"></div></div>
    <div class="pg" id="pg-mapa-placeholder"></div>
  </div>

</div>

<!-- FAB fora do #shell — evita stacking context do position:fixed -->
<button class="fab h" id="fab">＋ Adicionar Gasto</button>

<!-- MAPA FULLSCREEN -->
<div id="mapa-pg">
  <div class="m-top">
    <button id="mback" style="background:var(--sur);border:1px solid var(--bor);border-radius:99px;color:var(--txt);font-size:12px;padding:6px 13px;cursor:pointer;flex-shrink:0">← Voltar</button>
    <div id="mhdr" style="font-size:13px;font-weight:600;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">📍 Rota do Dia</div>
  </div>
  <div class="m-dias" id="mdias"></div>
  <div id="m-map"></div>
  <div class="m-status" id="mst" style="display:none"></div>
  <div id="m-list"></div>
</div>

<!-- MODAL GASTO -->
<div class="ov" id="og"><div class="sh">

  <div class="g2">

    <div><label class="fl">Nº DO DIA</label><input class="fi" id="dn" type="number" min="0" placeholder="1"/></div>

<!-- MODAL PARADA -->
<div class="ov" id="op"><div class="sh">
  <div class="hdl"></div><div class="mtit" id="opt">Nova Parada</div>
  <label class="fl">NOME</label><input class="fi" id="pn" type="text" autocomplete="off" placeholder="Ex: Torre de Belém"/>
  <label class="fl">TIPO</label><div class="tpills" id="tpills"></div>

  <label class="fl">ENDEREÇO</label><input class="fi" id="pe" type="text" autocomplete="off" placeholder="Opcional"/>

  <label class="fl">OBSERVAÇÃO</label><textarea class="fi" id="po" rows="3" style="resize:none;line-height:1.5;font-size:14px" placeholder="Reserva, dica..."></textarea>
  <div class="tg-r" id="rtog"><span style="font-size:13px">✅ Marcar como realizado</span><div class="tg-sw" id="rsw"></div></div>
  <div class="br"><button class="bc" id="pcnc">Cancelar</button><button class="bok" id="pok">Salvar Parada</button></div>
</div></div>

<!-- POPUP CAT -->
<div class="cov" id="ocm"><div class="csh">
  <div class="hdl"></div>
  <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:4px">
    <div id="cmt" style="font-size:16px;font-weight:800;display:flex;align-items:center;gap:6px"></div>
    <button class="bi" id="cmcl" style="font-size:18px;color:var(--mut2)">✕</button>
  </div>
  <div id="cmtot"></div>
  <div class="csh-l" id="cml"></div>
</div></div>

<!-- EDIT VIAGEM -->
<div class="eov" id="oev"><div class="ebox">
  <h3>✏️ Editar Viagem</h3>
  <label class="fl">NOME</label><input class="fi" id="evn" type="text" autocomplete="off"/>
  <label class="fl">ORÇAMENTO (R$)</label><input class="fi" id="evo" type="number" min="0" step="0.01"/>
  <div class="br"><button class="bc" id="evcnc">Cancelar</button><button class="bok" id="evok">Salvar</button></div>
</div></div>

<div class="toast" id="toast"></div>

<script>
const CATS=[
  {id:'hospedagem', label:'Hospedagem', e:'🏨',c:'#FF6B6B'},
  {id:'transporte', label:'Transporte', e:'✈️',c:'#4ECDC4'},
  {id:'alimentacao',label:'Alimentação',e:'🍽️',c:'#FFE66D'},
  {id:'passeios',   label:'Passeios',  e:'🎡',c:'#A8E6CF'},
  {id:'compras',    label:'Compras',   e:'🛍️',c:'#FF8B94'},
  {id:'outros',     label:'Outros',    e:'📦',c:'#C3B1E1'},
];
const TIPOS=[
  {id:'hotel',      label:'Hotel',      e:'🏨',c:'#FF6B6B'},
  {id:'restaurante',label:'Restaurante',e:'🍽️',c:'#FFE66D'},
  {id:'atração',    label:'Atração',    e:'🎡',c:'#4ECDC4'},
  {id:'transporte', label:'Transporte', e:'✈️',c:'#A8E6CF'},
  {id:'compras',    label:'Compras',    e:'🛍️',c:'#FF8B94'},
  {id:'outro',      label:'Outro',      e:'📍',c:'#C3B1E1'},
];
const PC=['#FF6B6B','#4ECDC4','#FFE66D','#A8E6CF','#FF8B94','#C3B1E1','#F7DC6F','#82E0AA','#F1948A','#85C1E9'];
const R=v=>new Intl.NumberFormat('pt-BR',{style:'currency',currency:'BRL'}).format(v);
const $=id=>document.getElementById(id);

let sb,vid=null,gastos=[],viagens=[];
let fcat=null,egid=null;
let rDias=[],rPars=[],dopen={};
let deid=null,peid=null,daid=null,rmod=false;
let lmap=null,lmks=[],lln=null;

// ── INIT ──────────────────────────────────────────────
(async()=>{
  sb=supabase.createClient(
    'https://evvvzmnguhgqaopvquhs.supabase.co',
    'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImV2dnZ6bW5ndWhncWFvcHZxdWhzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzkyMTMzODYsImV4cCI6MjA5NDc4OTM4Nn0.FSuRZjedHmJs4QRiCrk_DS1tzEO-tOU3pN8HG15Iw5g'
  );
  await loadViagens();
})();

// ── VIAGENS ───────────────────────────────────────────
async function loadViagens(){
  const{data}=await sb.from('viagens').select('*').order('criado_em',{ascending:false});
  viagens=data||[];
  if(!viagens.length)return;
  vid=viagens[0].id;
  drawChips();await loadGastos();
}
function drawChips(){
  const el=$('chips');el.innerHTML='';
  viagens.forEach(v=>{
    const c=document.createElement('div');c.className='chip'+(v.id===vid?' on':'');
    c.textContent=v.nome;c.onclick=async()=>{vid=v.id;drawChips();await loadGastos();};
    el.appendChild(c);
  });
  const a=document.createElement('div');a.className='chip add';a.textContent='+ nova';
  a.onclick=async()=>{
    const n=prompt('Nome:');if(!n)return;
    const o=parseFloat(prompt('Orçamento:')||'0');
    const{data,e}=await sb.from('viagens').insert({nome:n,orcamento:o}).select().single();
    if(e){toast('Erro');return;}viagens.unshift(data);vid=data.id;drawChips();await loadGastos();
  };el.appendChild(a);
}
$('tnm').onclick=()=>{
  const v=viagens.find(x=>x.id===vid);if(!v)return;
  $('evn').value=v.nome;$('evo').value=v.orcamento;
  $('oev').classList.add('on');setTimeout(()=>$('evn').focus(),100);
};
$('evcnc').onclick=()=>$('oev').classList.remove('on');
$('oev').onclick=e=>{if(e.target===$('oev'))$('oev').classList.remove('on');};
$('evok').onclick=async()=>{
  const n=$('evn').value.trim();if(!n)return;
  const o=parseFloat($('evo').value)||0;
  const v=viagens.find(x=>x.id===vid);if(!v)return;
  v.nome=n;v.orcamento=o;$('tnmt').textContent=n;drawChips();drawTop();
  $('oev').classList.remove('on');toast('Viagem atualizada ✓');
  await sb.from('viagens').update({nome:n,orcamento:o}).eq('id',vid);
};

// ── GASTOS ────────────────────────────────────────────
async function loadGastos(){
  const v=viagens.find(x=>x.id===vid);if(!v)return;
  $('tnmt').textContent=v.nome;
  const{data}=await sb.from('gastos').select('*').eq('viagem_id',vid).order('data',{ascending:false});
  gastos=data||[];drawTop();drawDash();drawList();
}
function drawTop(){
  const v=viagens.find(x=>x.id===vid);
  const tot=gastos.reduce((s,g)=>s+Number(g.valor),0);
  const orc=v?.orcamento||0;const rst=orc-tot;
  const pct=orc?Math.min(tot/orc*100,100):0;
  const cor=pct>90?'#FF6B6B':pct>70?'#FFE66D':'#4ECDC4';
  $('tv').textContent=R(tot);$('tv').style.color=cor;
  $('bval').textContent=R(orc);
  $('rv').textContent=rst>=0?`Restam ${R(rst)}`:`Excedido ${R(-rst)}`;
  $('rv').style.color=rst>=0?'#4ECDC4':'#FF6B6B';
  $('pb').style.width=pct+'%';
  // background é gradiente fixo via CSS — sem override inline
}
$('bval').onclick=async()=>{
  const v=viagens.find(x=>x.id===vid);if(!v)return;
  const n=parseFloat(prompt('Novo orçamento:',v.orcamento)||v.orcamento);
  if(isNaN(n)||n<0)return;v.orcamento=n;drawTop();toast('✓');
  await sb.from('viagens').update({orcamento:n}).eq('id',vid);
};

// ── DASHBOARD ─────────────────────────────────────────
function drawDash(){
  const el=$('pg-dash');el.innerHTML='';
  const tot=gastos.reduce((s,g)=>s+Number(g.valor),0);
  const bc=CATS.map(c=>({...c,tot:gastos.filter(g=>g.categoria===c.id).reduce((s,g)=>s+Number(g.valor),0)}));
  const mx=Math.max(...bc.map(c=>c.tot),1);
  // cat grid
  el.innerHTML+='<div class="sec">Por Categoria</div>';
  const gr=document.createElement('div');gr.className='cat-grid';
  bc.forEach(c=>{
    const d=document.createElement('div');d.className='cat-card';
    d.innerHTML=`<div class="i">${c.e}</div><div class="l">${c.label}</div><div class="v" style="color:${c.tot?c.c:'#333'}">${c.tot?R(c.tot):'—'}</div>`;
    d.onclick=()=>openCat(c.id);gr.appendChild(d);
  });
  el.appendChild(gr);
  // stats
  const v=viagens.find(x=>x.id===vid);const orc=v?.orcamento||0;
  const dias=[...new Set(gastos.map(g=>g.data))].length;
  const maior=gastos.length?gastos.reduce((a,b)=>Number(a.valor)>Number(b.valor)?a:b):null;
  const sg=document.createElement('div');sg.className='sg';
  sg.innerHTML=`
    <div class="sc"><div class="sl">Total Gasto</div><div class="sv" style="color:var(--teal)">${R(tot)}</div><div class="ss">${orc?Math.round(tot/orc*100)+'% do orçamento':'—'}</div></div>
    <div class="sc"><div class="sl">Lançamentos</div><div class="sv">${gastos.length}</div><div class="ss">${dias} dia${dias!==1?'s':''}</div></div>
    <div class="sc"><div class="sl">Ticket Médio</div><div class="sv" style="color:var(--yel)">${gastos.length?R(tot/gastos.length):'—'}</div><div class="ss">por lançamento</div></div>
    <div class="sc"><div class="sl">Maior Gasto</div><div class="sv" style="color:var(--red)">${maior?R(maior.valor):'—'}</div><div class="ss">${maior?maior.descricao.slice(0,16):'—'}</div></div>`;
  el.appendChild(sg);
  // donut
  el.innerHTML+='<div class="sec" style="margin-top:4px">Distribuição</div>';
  const dw=document.createElement('div');dw.className='donut-w';
  dw.innerHTML='<svg id="dsv" width="110" height="110" viewBox="0 0 110 110"></svg><div class="leg" id="dlg"></div>';
  el.appendChild(dw);buildDonut(bc,tot);
  // bars
  el.innerHTML+='<div class="sec">Por Categoria</div>';
  const bw=document.createElement('div');
  bc.filter(c=>c.tot>0).sort((a,b)=>b.tot-a.tot).forEach(c=>{
    const p=c.tot/mx*100;
    const rw=document.createElement('div');rw.className='bar-r';
    rw.innerHTML=`<div class="n">${c.e} ${c.label}</div><div class="bar-t"><div class="bar-f" style="width:${p}%;background:${c.c}"></div></div><div class="a" style="color:${c.c}">${R(c.tot)}</div>`;
    bw.appendChild(rw);
  });
  if(!bc.some(c=>c.tot>0))bw.innerHTML='<div style="color:#333;text-align:center;padding:16px;font-size:12px">Nenhum dado ainda</div>';
  el.appendChild(bw);
}
function buildDonut(bc,tot){
  const svg=$('dsv'),leg=$('dlg');if(!svg)return;
  svg.innerHTML='';leg.innerHTML='';
  const has=bc.filter(c=>c.tot>0);
  if(!has.length){svg.innerHTML='<circle cx="55" cy="55" r="38" fill="none" stroke="#252540" stroke-width="18"/>';return;}
  let a=-Math.PI/2;const R2=38,cx=55,cy=55;
  has.forEach(c=>{
    const sl=c.tot/tot*2*Math.PI;
    const x1=cx+R2*Math.cos(a),y1=cy+R2*Math.sin(a);
    const x2=cx+R2*Math.cos(a+sl),y2=cy+R2*Math.sin(a+sl);
    const p=document.createElementNS('http://www.w3.org/2000/svg','path');
    p.setAttribute('d',`M ${cx} ${cy} L ${x1} ${y1} A ${R2} ${R2} 0 ${sl>Math.PI?1:0} 1 ${x2} ${y2} Z`);
    p.setAttribute('fill',c.c);svg.appendChild(p);
    const h=document.createElementNS('http://www.w3.org/2000/svg','circle');
    h.setAttribute('cx',cx);h.setAttribute('cy',cy);h.setAttribute('r',20);h.setAttribute('fill','#0C0C18');
    svg.appendChild(h);a+=sl;
    leg.innerHTML+=`<div class="leg-r"><div class="leg-d" style="background:${c.c}"></div><span>${c.e} ${c.label}</span><span style="margin-left:auto;color:${c.c}">${Math.round(c.tot/tot*100)}%</span></div>`;
  });
}

// ── CAT POPUP ─────────────────────────────────────────
function openCat(cid){
  const c=CATS.find(x=>x.id===cid);
  const it=gastos.filter(g=>g.categoria===cid).sort((a,b)=>new Date(b.data)-new Date(a.data));
  const tc=it.reduce((s,g)=>s+Number(g.valor),0);
  const tg=gastos.reduce((s,g)=>s+Number(g.valor),0);
  const pct=tg?Math.round(tc/tg*100):0;

  // hero com KPI
  $('cmt').innerHTML=''; // limpa título antigo
  const hero=document.createElement('div');hero.className='csh-hero';
  hero.innerHTML=`
    <div class="csh-icon" style="background:color-mix(in srgb,${c.c} 15%,transparent)">
      <span>${c.e}</span>
    </div>
    <div class="csh-kpi">
      <div style="font-size:11px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:var(--mut2);margin-bottom:4px">${c.label}</div>
      <div class="csh-val" style="color:${c.c}">${R(tc)}</div>
      <div class="csh-meta">${it.length} lançamento${it.length!==1?'s':''} · ${pct}% do total</div>
      <div class="csh-pct-bar"><div class="csh-pct-fill" style="width:${pct}%;background:${c.c}"></div></div>
    </div>`;
  $('cmtot').innerHTML='';
  $('cmtot').appendChild(hero);

  // lista de itens com edit/delete
  const lista=$('cml');lista.innerHTML='';
  if(!it.length){
    lista.innerHTML='<div style="text-align:center;padding:32px;color:var(--mut)"><div style="font-size:32px;margin-bottom:8px">${c.e}</div><div style="font-size:13px">Nenhum gasto nesta categoria</div></div>';
  } else {
    it.forEach(g=>{
      const item=document.createElement('div');item.className='ci';item.style.setProperty('--c',c.c);
      const dt=g.data?g.data.split('-').reverse().join('/'):'';
      item.innerHTML=`
        <div class="ci-info">
          <div class="ci-desc">${g.descricao}</div>
          <div class="ci-sub">${dt}${g.observacao?' · '+g.observacao:''}</div>
        </div>
        <div class="ci-right">
          <span class="ci-val" style="color:${c.c}">${R(Number(g.valor))}</span>
          <div class="ci-acts">
            <button class="bi" style="font-size:14px">✏️</button>
            <button class="bi" style="font-size:14px">🗑️</button>
          </div>
        </div>`;
      item.querySelectorAll('.bi')[0].onclick=()=>{$('ocm').classList.remove('on');editG(g.id);};
      item.querySelectorAll('.bi')[1].onclick=async()=>{
        if(!confirm('Excluir?'))return;
        await delG(g.id);
        // reabre popup atualizado
        openCat(cid);
      };
      lista.appendChild(item);
    });
  }
  $('ocm').classList.add('on');
}
$('cmcl').onclick=()=>$('ocm').classList.remove('on');
$('ocm').onclick=e=>{if(e.target===$('ocm'))$('ocm').classList.remove('on');};

// ── LANÇAMENTOS — modo e filtro ────────────────────────
let lancMode='group'; // 'group' | 'list'
function setLancMode(m){
  lancMode=m;
  $('lm-group').classList.toggle('on',m==='group');
  $('lm-list').classList.toggle('on',m==='list');
  $('lanc-filter').style.display=m==='list'?'flex':'none';
  drawList();
}

// constrói barra de filtros de categoria (modo lista)
function buildLancFilter(){
  const fb=$('lanc-filter');fb.innerHTML='';
  const all=document.createElement('button');all.className='lf-btn'+(fcat===null?' on':'');
  all.textContent='Todos';all.onclick=()=>{fcat=null;buildLancFilter();drawList();};
  fb.appendChild(all);
  CATS.forEach(c=>{

// ── LIST ──────────────────────────────────────────────
function drawList(){
  const el=$('gl');el.innerHTML='';
  const tot=gastos.reduce((s,g)=>s+Number(g.valor),0);
  const maxCat=Math.max(...CATS.map(c=>gastos.filter(g=>g.categoria===c.id).reduce((s,g)=>s+Number(g.valor),0)),1);

  if(lancMode==='group'){
    // ── MODO AGRUPADO ──────────────────────────────────
    $('lc').textContent=`${gastos.length} lançamento${gastos.length!==1?'s':', '} · ${R(tot)}`;
    $('fcl').style.display='none';
    $('lanc-filter').style.display='none';
    const cats=CATS.map(c=>{
      const items=gastos.filter(g=>g.categoria===c.id).sort((a,b)=>new Date(b.data)-new Date(a.data));
      return{...c,items,total:items.reduce((s,g)=>s+Number(g.valor),0)};
    }).filter(c=>c.items.length>0).sort((a,b)=>b.total-a.total);

    if(!cats.length){
      el.innerHTML='<div style="text-align:center;padding:40px 0;color:var(--mut)"><div style="font-size:36px;margin-bottom:10px">💸</div><div style="font-size:13px">Nenhum lançamento ainda</div></div>';
      return;
    }
    cats.forEach(c=>{
      const pct=tot?Math.round(c.total/tot*100):0;
      const barPct=maxCat?Math.round(c.total/maxCat*100):0;
      const grp=document.createElement('div');grp.className='cat-group';
      const hdr=document.createElement('div');hdr.className='cat-group-hdr';
      hdr.innerHTML=`
        <span class="cat-group-icon">${c.e}</span>
        <div class="cat-group-info">
          <div class="cat-group-name">${c.label}</div>
          <div class="cat-group-sub">${c.items.length} lançamento${c.items.length!==1?'s':''} · ${pct}%</div>
        </div>
        <div class="cat-group-right">
          <span class="cat-group-total" style="color:${c.c}">${R(c.total)}</span>
          <div class="cat-group-bar"><div class="cat-group-bar-fill" style="width:${barPct}%;background:${c.c}"></div></div>
        </div>
        <span class="cat-group-chev">▼</span>`;
      // toggle expand
      let open=false;
      const itemsDiv=document.createElement('div');itemsDiv.className='cat-group-items';itemsDiv.style.display='none';
      c.items.forEach(g=>{
        const row=document.createElement('div');row.className='cat-group-item';
        const dt=g.data?g.data.split('-').reverse().join('/'):'';
        row.innerHTML=`
          <div class="cgi-left">
            <div class="cgi-desc">${g.descricao}</div>
            <div class="cgi-sub">${dt}${g.observacao?' · '+g.observacao:''}</div>
          </div>
          <div class="cgi-right">
            <span class="cgi-val" style="color:${c.c}">${R(Number(g.valor))}</span>
            <button class="bi" style="font-size:14px">✏️</button>
            <button class="bi" style="font-size:14px">🗑️</button>
          </div>`;
        row.querySelectorAll('.bi')[0].onclick=e=>{e.stopPropagation();editG(g.id);};
        row.querySelectorAll('.bi')[1].onclick=e=>{e.stopPropagation();delG(g.id);};
        itemsDiv.appendChild(row);
      });
      hdr.onclick=()=>{
        open=!open;
        itemsDiv.style.display=open?'block':'none';
        hdr.classList.toggle('open',open);
        hdr.querySelector('.cat-group-chev').classList.toggle('open',open);
      };
      grp.appendChild(hdr);grp.appendChild(itemsDiv);el.appendChild(grp);
    });

  } else {
    // ── MODO LISTA ─────────────────────────────────────
    buildLancFilter();
    const fl=fcat?gastos.filter(g=>g.categoria===fcat):gastos;
    const cat=fcat?CATS.find(c=>c.id===fcat):null;
    $('lc').textContent=cat
      ?`${cat.e} ${cat.label} — ${fl.length} item${fl.length!==1?'s':''} · ${R(fl.reduce((s,g)=>s+Number(g.valor),0))}`
      :`${fl.length} lançamento${fl.length!==1?'s':''} · ${R(tot)}`;
    $('fcl').style.display=fcat?'inline':'none';
    if(!fl.length){
      el.innerHTML='<div style="text-align:center;padding:40px 0;color:var(--mut)"><div style="font-size:36px;margin-bottom:10px">🔍</div><div style="font-size:13px">Nenhum lançamento</div></div>';
      return;
    }
    fl.forEach(g=>{
      const c=CATS.find(x=>x.id===g.categoria)||CATS[5];
      const d=document.createElement('div');d.className='gi';d.style.setProperty('--c',c.c);
      const dt=g.data?g.data.split('-').reverse().join('/'):'';
      d.innerHTML=`
        <div class="gl"><span style="font-size:20px">${c.e}</span>
          <div>
            <div style="font-size:13px;font-weight:600">${g.descricao}</div>
            <div style="font-size:10px;color:var(--mut2);font-weight:500">${dt}${g.observacao?' · '+g.observacao:''}</div>
          </div>
        </div>
        <div class="gr">
          <span style="font-size:14px;font-weight:700;color:${c.c}">${R(Number(g.valor))}</span>
          <div style="display:flex;gap:4px">
            <button class="bi">✏️</button><button class="bi">🗑️</button>
          </div>
        </div>`;
      d.querySelectorAll('.bi')[0].onclick=()=>editG(g.id);
      d.querySelectorAll('.bi')[1].onclick=()=>delG(g.id);
      el.appendChild(d);
    });
  }
}

async function loadRot(){
  const{data:dias}=await sb.from('roteiro_dias').select('*').eq('viagem_id',vid).order('numero');
  rDias=dias||[];
  if(rDias.length){
    const{data:pars}=await sb.from('roteiro_paradas').select('*').in('dia_id',rDias.map(d=>d.id)).order('ordem');
    rPars=pars||[];
  }else rPars=[];
}
function drawRot(){
  const el=$('rw');el.innerHTML='';
  const ab=document.createElement('button');ab.className='bs';
  ab.style.cssText='width:100%;margin-bottom:12px;padding:10px;color:var(--teal);border-color:var(--teal);font-size:13px;font-weight:600';
  ab.textContent='+ Adicionar Dia';ab.onclick=()=>openDia(null);el.appendChild(ab);
  if(!rDias.length){el.innerHTML+='<div style="text-align:center;padding:40px 0;color:#444"><div style="font-size:36px;margin-bottom:10px">🗺️</div><div>Nenhum dia</div></div>';return;}
  rDias.forEach(dia=>{
    const pars=[...rPars.filter(p=>p.dia_id===dia.id)].sort((a,b)=>a.ordem-b.ordem);
    const ab2=dopen[dia.id]!==false;
    const dtf=dia.data?new Date(dia.data+'T12:00').toLocaleDateString('pt-BR',{weekday:'short',day:'2-digit',month:'short'}):'';
    const card=document.createElement('div');card.className='dc';
    const hdr=document.createElement('div');hdr.className='dh';
    hdr.innerHTML=`<span class="db-g">Dia ${dia.numero}</span><span class="db-t">${dia.titulo}</span><span class="db-d">${dtf}</span><span style="color:var(--mut);font-size:10px;flex-shrink:0">${ab2?'▲':'▼'}</span>`;
    hdr.onclick=()=>{dopen[dia.id]=!ab2;drawRot();};card.appendChild(hdr);
    if(ab2){
      const body=document.createElement('div');body.className='db-body';
      if(dia.descricao){const dc=document.createElement('div');dc.className='db-desc';dc.textContent=dia.descricao;body.appendChild(dc);}
      const pw=document.createElement('div');
      if(!pars.length){pw.innerHTML='<div style="font-size:11px;color:#444;padding:8px 0">Sem paradas — adicione abaixo</div>';}
      else{
        pars.forEach((p,i)=>{
          const t=TIPOS.find(x=>x.id===p.tipo)||TIPOS[5];
          const row=document.createElement('div');row.className='pi';
          const lh=document.createElement('div');lh.className='p-lh';
          const dot=document.createElement('div');dot.className='p-dot';
          dot.style.cssText=`background:color-mix(in srgb,${t.c} 18%,transparent);border:2px solid ${t.c}`;
          dot.textContent=t.e;lh.appendChild(dot);
          if(i<pars.length-1){const ln=document.createElement('div');ln.className='p-line';lh.appendChild(ln);}
          row.appendChild(lh);
          const info=document.createElement('div');info.className='p-info';
          const nm=document.createElement('div');nm.className='p-nm'+(p.realizado?' done':'');nm.textContent=p.nome;info.appendChild(nm);
          if(p.horario){const hb=document.createElement('div');hb.className='p-hor';hb.textContent='⏰ '+p.horario;info.appendChild(hb);}
          if(p.endereco){const en=document.createElement('div');en.className='p-end';en.textContent='📍 '+p.endereco;info.appendChild(en);}
          if(p.observacao){
            const obs=document.createElement('div');obs.className='p-obs';obs.textContent='💬 '+p.observacao;info.appendChild(obs);
            if(p.observacao.length>55){
              const tg=document.createElement('span');tg.className='p-tog';tg.textContent='ver mais ▾';
              tg.onclick=e=>{e.stopPropagation();const op=obs.classList.toggle('open');tg.textContent=op?'ver menos ▴':'ver mais ▾';};
              info.appendChild(tg);
            }
          }
          row.appendChild(info);
          // botões
          const btns=document.createElement('div');btns.className='p-btns';
          const ar=document.createElement('div');ar.className='p-br';
          const u=document.createElement('button');u.className='ob';u.textContent='▲';u.disabled=i===0;
          u.onclick=e=>{e.stopPropagation();moverP(dia.id,p.id,-1);};
          const d2=document.createElement('button');d2.className='ob';d2.textContent='▼';d2.disabled=i===pars.length-1;
          d2.onclick=e=>{e.stopPropagation();moverP(dia.id,p.id,+1);};
          ar.appendChild(u);ar.appendChild(d2);btns.appendChild(ar);
          const ar2=document.createElement('div');ar2.className='p-br';
          const ck=document.createElement('button');ck.className='ck'+(p.realizado?' done':'');ck.textContent=p.realizado?'✓':'';
          ck.onclick=()=>togReal(p.id,p.realizado);ar2.appendChild(ck);
          const eb=document.createElement('button');eb.className='bi';eb.textContent='✏️';eb.style.fontSize='14px';eb.onclick=()=>openPar(dia.id,p.id);ar2.appendChild(eb);
          const db2=document.createElement('button');db2.className='bi';db2.textContent='🗑️';db2.style.fontSize='14px';db2.onclick=()=>delPar(p.id);ar2.appendChild(db2);
          btns.appendChild(ar2);row.appendChild(btns);pw.appendChild(row);
        });
      }
      body.appendChild(pw);
      const acts=document.createElement('div');acts.className='da';
      const bp=document.createElement('button');bp.className='bs';bp.style.cssText='color:var(--teal);border-color:var(--teal);font-weight:600';bp.textContent='+ Parada';
      bp.onclick=e=>{e.stopPropagation();openPar(dia.id,null);};acts.appendChild(bp);
      const be=document.createElement('button');be.className='bs';be.textContent='✏️ Dia';be.onclick=e=>{e.stopPropagation();openDia(dia.id);};acts.appendChild(be);
      const bd=document.createElement('button');bd.className='bs';bd.style.color='var(--red)';bd.textContent='🗑️';bd.onclick=e=>{e.stopPropagation();delDia(dia.id);};acts.appendChild(bd);
      body.appendChild(acts);card.appendChild(body);
    }
    el.appendChild(card);
  });
}

// ── MOVER PARADA ──────────────────────────────────────
async function moverP(diaId,parId,dir){
  const lista=[...rPars.filter(p=>p.dia_id===diaId)].sort((a,b)=>a.ordem-b.ordem);
  const idx=lista.findIndex(p=>p.id===parId);
  const ni=idx+dir;
  if(idx===-1||ni<0||ni>=lista.length)return;
  const pA=lista[idx],pB=lista[ni];
  const oA=pA.ordem,oB=pB.ordem;
  const iA=rPars.findIndex(p=>p.id===pA.id);
  const iB=rPars.findIndex(p=>p.id===pB.id);
  rPars[iA].ordem=oB;rPars[iB].ordem=oA;
  drawRot();
  const r1=await sb.from('roteiro_paradas').update({ordem:oB}).eq('id',pA.id);
  const r2=await sb.from('roteiro_paradas').update({ordem:oA}).eq('id',pB.id);
  if(r1.error||r2.error){
    rPars[iA].ordem=oA;rPars[iB].ordem=oB;drawRot();toast('Erro ao salvar ⚠️');
  }else toast('Ordem atualizada ✓');
}

async function togReal(id,atual){
  const i=rPars.findIndex(p=>p.id===id);if(i===-1)return;
  rPars[i].realizado=!atual;drawRot();
  await sb.from('roteiro_paradas').update({realizado:!atual}).eq('id',id);
}

  if(rDias.length){
    // retoma o dia que estava selecionado antes, ou o primeiro
    const diaInicial=lastDiaId?rDias.find(d=>d.id===lastDiaId)||rDias[0]:rDias[0];
    await drawMDia(diaInicial);
  } else {
    $('m-list').innerHTML='<div style="text-align:center;padding:32px;color:#444">Nenhum dia no roteiro</div>';
  }
}
function drawMDias(){
  const w=$('mdias');w.innerHTML='';
  rDias.forEach((dia)=>{
    const isActive=lastDiaId?dia.id===lastDiaId:rDias.indexOf(dia)===0;
    const b=document.createElement('div');b.className='m-btn'+(isActive?' on':'');
    b.textContent=`Dia ${dia.numero} · ${dia.titulo.split('—')[0].split('&')[0].trim().slice(0,20)}`;
    b.onclick=async()=>{
      document.querySelectorAll('.m-btn').forEach(x=>x.classList.remove('on'));
      b.classList.add('on');
      lastDiaId=dia.id;
      await drawMDia(dia);
    };
    w.appendChild(b);
  });
}
// ── EXTRAI LAT/LNG DE URL GOOGLE MAPS ─────────────────
function extractCoordsFromGmaps(url){
  if(!url)return null;
  // formato: @lat,lng ou ?q=lat,lng ou /place/.../@lat,lng
  let m;
  // @lat,lng,zoom
  m=url.match(/@(-?\d+\.\d+),(-?\d+\.\d+)/);
  if(m)return{lat:+m[1],lng:+m[2]};
  // ?q=lat,lng
  m=url.match(/[?&]q=(-?\d+\.\d+),(-?\d+\.\d+)/);
  if(m)return{lat:+m[1],lng:+m[2]};
  // /maps/place/.../@lat,lng
  m=url.match(/maps\/place\/[^/@]*\/@(-?\d+\.\d+),(-?\d+\.\d+)/);
  if(m)return{lat:+m[1],lng:+m[2]};
  // ?ll=lat,lng
  m=url.match(/[?&]ll=(-?\d+\.\d+),(-?\d+\.\d+)/);
  if(m)return{lat:+m[1],lng:+m[2]};
  return null;
}

// ── RESOLVE LINK ENCURTADO (goo.gl / maps.app.goo.gl) ─
async function resolveShortLink(url){
  if(!url)return url;
  // links encurtados não contêm coordenadas — tentamos resolver via HEAD no Nominatim proxy
  // como CORS bloqueia a maioria, usamos uma abordagem alternativa:
  // extraímos o destino diretamente da URL se possível, senão retornamos null para cair no Nominatim
  if(url.includes('maps.app.goo.gl')||url.includes('goo.gl/maps')){
    // não conseguimos expandir no browser por CORS — retorna null para usar Nominatim
    return null;
  }
  return url;
}

// ── MONTA URL DE ROTA GOOGLE MAPS COM WAYPOINTS ───────
function buildRouteUrl(pars){
  if(!pars.length)return null;
  // para 1 parada: abre direto no link salvo ou busca por nome
  if(pars.length===1){
    const p=pars[0];
    if(p.gmaps_link&&p.gmaps_link.startsWith('http'))return p.gmaps_link;
    return`https://www.google.com/maps/search/?api=1&query=${encodeURIComponent((p.endereco||p.nome)+', Portugal')}`;
  }
  // para múltiplas: usa formato dir/?api=1 com origin, destination, waypoints (texto)
  // este formato aceita nomes/endereços e funciona bem no mobile
  const labels=pars.map(p=>p.endereco||(p.nome+', Portugal'));
  const origin=encodeURIComponent(labels[0]);
  const destination=encodeURIComponent(labels[labels.length-1]);
  const waypoints=labels.slice(1,-1).map(l=>encodeURIComponent(l)).join('|');
  let url=`https://www.google.com/maps/dir/?api=1&origin=${origin}&destination=${destination}&travelmode=walking`;
  if(waypoints)url+=`&waypoints=${waypoints}`;
  return url;
}

async function drawMDia(dia){
  lastDiaId=dia.id; // persiste para retomar ao voltar ao mapa
  const pars=[...rPars.filter(p=>p.dia_id===dia.id)].sort((a,b)=>a.ordem-b.ordem);
  const el=$('m-list');el.innerHTML='';
  $('mhdr').textContent=`📍 Dia ${dia.numero} · ${dia.titulo}`;

  // limpa mapa
  lmks.forEach(m=>lmap.removeLayer(m));lmks=[];
  if(lln){lmap.removeLayer(lln);lln=null;}
  if(!pars.length){
    el.innerHTML='<div style="text-align:center;padding:32px;color:#444">Nenhuma parada neste dia</div>';
    return;
  }

  // paradas pendentes (não realizadas) — só essas vão pro mapa
  const parsMap=pars.filter(p=>!p.realizado);

  // rota card — usa apenas pendentes para a rota
  const dtf=dia.data?new Date(dia.data+'T12:00').toLocaleDateString('pt-BR',{weekday:'long',day:'2-digit',month:'long'}):'';
  const rurl=buildRouteUrl(parsMap.length?parsMap:pars);
  const rc=document.createElement('div');rc.className='rc';
  const totTxt=`${pars.length} parada${pars.length!==1?'s':''}`;
  const realTxt=pars.filter(p=>p.realizado).length?` · ✅ ${pars.filter(p=>p.realizado).length} realizada${pars.filter(p=>p.realizado).length!==1?'s':''}`:'' ;
  rc.innerHTML=`<div class="rc-t">Dia ${dia.numero} · ${dia.titulo}</div><div class="rc-s">${dtf} · ${totTxt}${realTxt}</div>`;
  const ra=document.createElement('a');ra.className='btn-gmaps-full';ra.href=rurl;ra.target='_blank';ra.rel='noopener';
  ra.innerHTML='🗺️ Abrir rota completa no Google Maps';
  rc.appendChild(ra);el.appendChild(rc);

  // ── LISTA COMPLETA (todas as paradas, realizadas aparecem riscadas) ──
  const lista=document.createElement('div');
  lista.style.cssText='background:var(--sur);border:1px solid var(--bor);border-radius:14px;padding:4px 14px;margin-bottom:16px';
  pars.forEach((p,i)=>{
    const t=TIPOS.find(x=>x.id===p.tipo)||TIPOS[5];
    const item=document.createElement('div');item.className='mr';
    // número sequencial na lista (cor esmaecida se realizado)
    const cor=p.realizado?'#444':PC[i%PC.length];
    const lh=document.createElement('div');lh.className='mr-lh';
    const n=document.createElement('div');n.className='mr-n';
    n.style.cssText=`background:${cor};${p.realizado?'opacity:.4':''}`;
    n.textContent=i+1;lh.appendChild(n);
    if(i<pars.length-1){const ln=document.createElement('div');ln.className='mr-ln';lh.appendChild(ln);}
    item.appendChild(lh);
    const info=document.createElement('div');info.className='mr-info';
    if(p.realizado)info.style.opacity='.45';
    const hasLink=p.gmaps_link&&p.gmaps_link.startsWith('http');
    const realBadge=p.realizado?'<span style="font-size:9px;background:color-mix(in srgb,var(--teal) 15%,transparent);color:var(--teal);border-radius:4px;padding:1px 5px;border:1px solid color-mix(in srgb,var(--teal) 30%,transparent)">✓ feito</span> ':'';
    const linkBadge=hasLink?'<span style="font-size:9px;background:color-mix(in srgb,#1A73E8 18%,transparent);color:#6AB4F5;border-radius:4px;padding:1px 5px;border:1px solid color-mix(in srgb,#1A73E8 35%,transparent)">📌 link</span>':'';
    info.innerHTML=`<div class="mr-nm" style="${p.realizado?'text-decoration:line-through':''}">${t.e} ${p.nome} ${realBadge}${linkBadge}</div><div class="mr-mt">${p.horario?'⏰ '+p.horario+' · ':''}${t.label}</div>`;
    if(p.observacao){
      const ob=document.createElement('div');ob.className='mr-obs';ob.textContent='💬 '+p.observacao;info.appendChild(ob);
      if(p.observacao.length>60){const tg=document.createElement('span');tg.className='p-tog';tg.textContent='ver mais ▾';tg.onclick=()=>{const op=ob.classList.toggle('open');tg.textContent=op?'ver menos ▴':'ver mais ▾';};info.appendChild(tg);}
    }
    const url=hasLink?p.gmaps_link:`https://www.google.com/maps/search/?api=1&query=${encodeURIComponent((p.endereco||p.nome)+', Portugal')}`;
    const lk=document.createElement('a');lk.className='btn-gm';lk.href=url;lk.target='_blank';lk.rel='noopener';
    lk.innerHTML=hasLink?'📍 Abrir no Maps':'🔍 Buscar no Maps';info.appendChild(lk);
    item.appendChild(info);lista.appendChild(item);
  });
  el.appendChild(lista);

  // ── GEOCODIFICAÇÃO — apenas paradas NÃO realizadas ──
  if(!parsMap.length){
    $('mst').style.display='block';
    $('mst').textContent='✅ Todas as paradas já foram realizadas';
    setTimeout(()=>{ $('mst').style.display='none'; },3000);
    return;
  }

  $('mst').style.display='block';
  $('mst').textContent=`🔍 Localizando ${parsMap.length} parada${parsMap.length!==1?'s':''} no mapa...`;

  // tenta inferir país/região pelo nome do dia (heurística simples)
  const tituloLower=(dia.titulo||'').toLowerCase();
  const ehBrasil=/brasil|brazil|campinas|viracopos|são paulo|rio|brasília|bh|fortaleza|manaus|salvador/.test(tituloLower);
  const pais=ehBrasil?'Brasil':'Portugal';
  const countrycodes=ehBrasil?'br':'pt';

  // mapa cidade → { nome, viewbox: "lon_min,lat_max,lon_max,lat_min" }
  // viewbox delimita a área geográfica — bounded=1 força resultados DENTRO dessa área
  const cidadeMap={
    'alfama':   {nome:'Lisboa',   vb:'-9.30,38.85,-8.95,38.60'},  // Lisboa metro alargada
    'belém':    {nome:'Lisboa',   vb:'-9.30,38.85,-8.95,38.60'},
    'lisboa':   {nome:'Lisboa',   vb:'-9.30,38.85,-8.95,38.60'},
    'sintra':   {nome:'Sintra',   vb:'-9.48,38.85,-9.30,38.75'},
    'cascais':  {nome:'Cascais',  vb:'-9.45,38.73,-9.38,38.69'},
    'évora':    {nome:'Évora',    vb:'-7.96,38.59,-7.86,38.55'},
    'evora':    {nome:'Évora',    vb:'-7.96,38.59,-7.86,38.55'},
    'porto':    {nome:'Porto',    vb:'-8.72,41.20,-8.56,41.12'},
    'gaia':     {nome:'V.N.Gaia', vb:'-8.66,41.14,-8.58,41.10'},
    'funchal':  {nome:'Funchal',  vb:'-16.97,32.67,-16.85,32.62'},
    'madeira':  {nome:'Funchal',  vb:'-16.97,32.67,-16.85,32.62'},
    'óbidos':   {nome:'Óbidos',   vb:'-9.18,39.38,-9.14,39.35'},
    'obidos':   {nome:'Óbidos',   vb:'-9.18,39.38,-9.14,39.35'},
    'nazaré':   {nome:'Nazaré',   vb:'-9.09,39.61,-9.05,39.59'},
    'nazare':   {nome:'Nazaré',   vb:'-9.09,39.61,-9.05,39.59'},
    'esporão':  {nome:'Reguengos',vb:'-7.58,38.45,-7.50,38.38'},
    'aveiro':   {nome:'Aveiro',   vb:'-8.68,40.65,-8.62,40.62'},
    'coimbra':  {nome:'Coimbra',  vb:'-8.47,40.22,-8.40,40.18'},
    'braga':    {nome:'Braga',    vb:'-8.47,41.56,-8.40,41.53'},
    'guimarães':{nome:'Guimarães',vb:'-8.32,41.46,-8.27,41.43'},
    'guimaraes':{nome:'Guimarães',vb:'-8.32,41.46,-8.27,41.43'},
    'alentejo': {nome:'Alentejo', vb:'-8.50,38.80,-6.80,37.40'},
    'viracopos':{nome:'Campinas', vb:'-47.20,-22.80,-47.00,-23.00'},
    'campinas': {nome:'Campinas', vb:'-47.20,-22.80,-47.00,-23.00'},
  };
  let cidadeCtx='';
  let viewbox='';
  let vbBounds=null; // {lonMin,latMin,lonMax,latMax} para validar coords retornadas
  for(const [k,v] of Object.entries(cidadeMap)){
    if(tituloLower.includes(k)){
      cidadeCtx=v.nome;viewbox=v.vb;
      const [lonMin,latMax,lonMax,latMin]=v.vb.split(',').map(Number);
      vbBounds={lonMin,lonMax,latMin,latMax};
      break;
    }
  }

  // verifica se coordenada está dentro da bbox
  const dentroVB=(lat,lng)=>!vbBounds||(lat>=vbBounds.latMin&&lat<=vbBounds.latMax&&lng>=vbBounds.lonMin&&lng<=vbBounds.lonMax);

  const coords=[];
  for(let i=0;i<parsMap.length;i++){
    const p=parsMap[i];

    // 1ª prioridade: coords direto da URL (links não-encurtados)
    const directCoords=extractCoordsFromGmaps(p.gmaps_link);
    if(directCoords){
      coords.push({p,lat:directCoords.lat,lng:directCoords.lng,ok:true,src:'link'});
      continue;
    }

    // query base: endereço > nome+cidade > nome+país
    const q=p.endereco?.trim()
      ? p.endereco.trim()
      : cidadeCtx ? `${p.nome}, ${cidadeCtx}` : `${p.nome}, ${pais}`;

    const tryNominatim=async(extraParams={})=>{
      const ps=new URLSearchParams({format:'json',limit:'5',q,countrycodes,'accept-language':'pt-BR',...extraParams});
      const r=await fetch(`https://nominatim.openstreetmap.org/search?${ps}`,{headers:{'User-Agent':'TripCash/1.0'}});
      return r.json();
    };

    try{
      let resultado=null;

      if(viewbox){
        // tentativa 1: bounded=1 — só dentro da bbox
        const d1=await tryNominatim({viewbox,bounded:'1'});
        if(d1.length)resultado={lat:+d1[0].lat,lng:+d1[0].lon};
      }

      if(!resultado&&viewbox){
        // tentativa 2: bounded=0 — prioriza bbox mas aceita fora
        // validamos manualmente: só aceita se a coord estiver dentro da bbox
        const d2=await tryNominatim({viewbox,bounded:'0'});
        const match=d2.find(r=>dentroVB(+r.lat,+r.lon));
        if(match)resultado={lat:+match.lat,lng:+match.lon};
      }

      if(!resultado){
        // fallback final: sem viewbox, aceita qualquer resultado no país
        const d3=await tryNominatim();
        if(d3.length)resultado={lat:+d3[0].lat,lng:+d3[0].lon};
      }

      coords.push(resultado?{p,lat:resultado.lat,lng:resultado.lng,ok:true,src:'nominatim'}:{p,ok:false,src:'fail'});
    }catch{coords.push({p,ok:false,src:'fail'});}

    if(i<parsMap.length-1)await new Promise(r=>setTimeout(r,400));
  }

  $('mst').style.display='none';
  const found=coords.filter(c=>c.ok);
  if(!found.length){
    $('mst').style.display='block';
    $('mst').textContent='📍 Não foi possível localizar as paradas no mapa';
    setTimeout(()=>{ $('mst').style.display='none'; },3000);
    return;
  }

  const lls=[];
  // numeração no mapa = posição na lista original (mantém consistência com a lista)
  found.forEach((c,i)=>{
    const t=TIPOS.find(x=>x.id===c.p.tipo)||TIPOS[5];
    const listIdx=pars.findIndex(p=>p.id===c.p.id);
    const num=listIdx>=0?listIdx+1:i+1;
    const cor=PC[listIdx>=0?listIdx%PC.length:i%PC.length];
    const icon=L.divIcon({
      html:`<div style="width:28px;height:28px;background:${cor};border-radius:50% 50% 50% 0;transform:rotate(-45deg);display:flex;align-items:center;justify-content:center;border:2px solid rgba(255,255,255,.8);box-shadow:0 2px 8px rgba(0,0,0,.5)"><span style="transform:rotate(45deg);font-size:11px;font-weight:700;color:#fff">${num}</span></div>`,
      iconSize:[28,28],iconAnchor:[14,28],popupAnchor:[0,-30],className:''
    });
    const mk=L.marker([c.lat,c.lng],{icon}).addTo(lmap);
    mk.bindPopup(`<strong>${num}. ${c.p.nome}</strong><br><span style="color:#888;font-size:11px">${t.e} ${t.label}${c.p.horario?' · ⏰ '+c.p.horario:''}</span>`);
    lmks.push(mk);lls.push([c.lat,c.lng]);
  });

  if(lls.length>1)lln=L.polyline(lls,{color:'#4ECDC4',weight:3,opacity:.75,dashArray:'8,5'}).addTo(lmap);
  lmap.fitBounds(L.featureGroup(lmks).getBounds().pad(0.3));
  setTimeout(()=>lmap&&lmap.invalidateSize(),150);
}

// ── TABS ──────────────────────────────────────────────
document.querySelectorAll('.tab').forEach(tab=>{
  tab.onclick=async()=>{
    const t=tab.dataset.t;
    document.querySelectorAll('.tab').forEach(x=>x.classList.remove('on'));tab.classList.add('on');
    if(t==='mapa'){
      $('mapa-pg').classList.add('on');
      $('fab').classList.add('h');
      await initMapa();
    }else{
      $('mapa-pg').classList.remove('on');
      document.querySelectorAll('.pg').forEach(p=>p.classList.remove('on'));
      $(`pg-${t==='dash'?'dash':t==='lanc'?'lanc':'rot'}`).classList.add('on');
      $('fab').classList.toggle('h',t!=='lanc');
      if(t==='rot'){await loadRot();drawRot();}
    }
  };
});
$('mback').onclick=()=>{
  $('mapa-pg').classList.remove('on');
  document.querySelectorAll('.tab').forEach(x=>x.classList.remove('on'));
  document.querySelector('[data-t="dash"]').classList.add('on');
  document.querySelectorAll('.pg').forEach(p=>p.classList.remove('on'));
  $('pg-dash').classList.add('on');
  $('fab').classList.add('h');
};

// ── TEMA ──────────────────────────────────────────────
function toggleTheme(){
  const light=document.body.classList.toggle('light');
  $('theme-btn').textContent=light?'☀️':'🌙';
  localStorage.setItem('theme',light?'light':'dark');
}
// restaura tema salvo
if(localStorage.getItem('theme')==='light'){
  document.body.classList.add('light');
  document.addEventListener('DOMContentLoaded',()=>{const b=$('theme-btn');if(b)b.textContent='☀️';});
}

// ── TOAST ─────────────────────────────────────────────
function toast(msg,dur=2000){
  const el=$('toast');el.textContent=msg;el.classList.add('show');
  setTimeout(()=>el.classList.remove('show'),dur);
}
