<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"/>
<meta http-equiv="Pragma" content="no-cache"/>
<meta http-equiv="Expires" content="0"/>
<title>TripCash v3</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#0F0F1A;--sur:#1A1A2E;--bor:#2A2A3E;
  --txt:#F0EDE8;--mut:#7A7A8C;--teal:#4ECDC4;
  --yel:#FFE66D;--red:#FF6B6B;
  --st:env(safe-area-inset-top,0px);
  --sb:env(safe-area-inset-bottom,0px);
}
html,body{height:100%;background:var(--bg);color:var(--txt);font-family:-apple-system,sans-serif;overflow:hidden}

/* ── SHELL ── */
#shell{position:fixed;inset:0;display:flex;flex-direction:column;padding-top:var(--st)}

/* ── TOPBAR ── */
#topbar{flex-shrink:0;padding:12px 16px 0;background:var(--bg)}
.tb-row{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.trip-lbl{font-size:10px;letter-spacing:3px;color:var(--teal);text-transform:uppercase;margin-bottom:2px}
.trip-nm{font-size:20px;font-weight:700;cursor:pointer;display:flex;align-items:center;gap:6px;line-height:1.2}
.bud-box{text-align:right;flex-shrink:0}
.bud-lbl{font-size:10px;color:var(--mut)}
.bud-val{font-size:15px;font-weight:700;cursor:pointer}
.prog{margin-top:8px;background:var(--sur);border-radius:99px;height:6px;overflow:hidden}
.prog-b{height:100%;border-radius:99px;transition:width .5s,background .3s}
.prog-inf{display:flex;justify-content:space-between;margin-top:4px;font-size:11px;color:var(--mut);padding-bottom:8px}
.chips{display:flex;gap:6px;flex-wrap:wrap;padding:4px 0 6px}
.chip{background:var(--sur);border:1px solid var(--bor);border-radius:99px;font-size:11px;padding:3px 10px;cursor:pointer;color:var(--mut)}
.chip.on{border-color:var(--teal);color:var(--teal)}
.chip.add{color:var(--teal);border-style:dashed}

/* ── TABS ── */
#tabs{flex-shrink:0;display:flex;gap:3px;padding:0 16px 8px;background:var(--bg)}
.tab{flex:1;background:var(--sur);border:1px solid var(--bor);border-radius:99px;color:var(--mut);font-size:11px;padding:7px 2px;cursor:pointer;text-align:center}
.tab.on{background:var(--teal);border-color:var(--teal);color:var(--bg);font-weight:700}

/* ── PAGES ── */
#pages{flex:1;overflow:hidden;position:relative;min-height:0}
.pg{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;padding:12px 16px calc(var(--sb)+80px);display:none}
.pg.on{display:block}

/* ── DASHBOARD ── */
.sec{font-size:10px;letter-spacing:2px;color:var(--mut);text-transform:uppercase;margin-bottom:8px;margin-top:4px}
.cat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:16px}
.cat-card{background:var(--sur);border:1px solid var(--bor);border-radius:12px;padding:10px 6px;text-align:center;cursor:pointer}
.cat-card .i{font-size:20px}
.cat-card .l{font-size:9px;color:var(--mut);margin-top:2px;text-transform:uppercase;letter-spacing:1px}
.cat-card .v{font-size:11px;margin-top:3px;font-weight:700}
.sg{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:16px}
.sc{background:var(--sur);border:1px solid var(--bor);border-radius:12px;padding:12px}
.sl{font-size:9px;color:var(--mut);text-transform:uppercase;letter-spacing:1px;margin-bottom:4px}
.sv{font-size:17px;font-weight:700}
.ss{font-size:10px;color:var(--mut);margin-top:2px}
.donut-w{display:flex;align-items:center;gap:14px;margin-bottom:16px}
.leg{flex:1}
.leg-r{display:flex;align-items:center;gap:6px;margin-bottom:5px;font-size:11px}
.leg-d{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.bar-r{display:flex;align-items:center;gap:8px;margin-bottom:7px}
.bar-r .n{font-size:11px;width:80px;flex-shrink:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar-t{flex:1;background:var(--sur);border-radius:99px;height:6px;overflow:hidden}
.bar-f{height:100%;border-radius:99px}
.bar-r .a{font-size:11px;width:72px;text-align:right;flex-shrink:0}

/* ── LANÇAMENTOS ── */
.lh{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.gi{background:var(--sur);border:1px solid var(--bor);border-left:3px solid var(--c,var(--teal));border-radius:10px;padding:11px 12px;display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.gl{display:flex;align-items:center;gap:9px}
.gr{display:flex;align-items:center;gap:8px;flex-shrink:0}
.bi{background:none;border:none;font-size:15px;cursor:pointer;padding:2px;color:var(--txt)}

/* ── ROTEIRO ── */
.dc{background:var(--sur);border:1px solid var(--bor);border-radius:14px;margin-bottom:12px;overflow:hidden}
.dh{display:flex;align-items:center;padding:12px 14px;cursor:pointer;gap:8px}
.db-g{background:var(--teal);color:var(--bg);border-radius:99px;font-size:9px;font-weight:700;padding:3px 9px;flex-shrink:0}
.db-t{font-size:14px;font-weight:600;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.db-d{font-size:10px;color:var(--mut);flex-shrink:0}
.db-body{padding:0 14px 12px;border-top:1px solid var(--bor)}
.db-desc{font-size:11px;color:var(--mut);padding:8px 0 6px;line-height:1.5}
.pi{display:flex;gap:8px;align-items:flex-start;padding:9px 0;border-bottom:1px solid var(--bor)}
.pi:last-child{border-bottom:none}
.p-lh{display:flex;flex-direction:column;align-items:center;flex-shrink:0}
.p-dot{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:13px}
.p-line{width:2px;flex:1;min-height:12px;background:var(--bor);margin-top:2px}
.p-info{flex:1;min-width:0}
.p-nm{font-size:13px;font-weight:600;line-height:1.3}
.p-nm.done{text-decoration:line-through;opacity:.4}
.p-hor{display:inline-flex;align-items:center;gap:3px;font-size:11px;color:var(--teal);font-weight:600;margin-top:3px;background:color-mix(in srgb,var(--teal) 12%,transparent);padding:2px 7px;border-radius:99px}
.p-end{font-size:10px;color:var(--mut);margin-top:3px}
.p-obs{font-size:11px;color:var(--mut);margin-top:5px;line-height:1.5;background:var(--bg);border-radius:8px;padding:6px 8px;border-left:2px solid var(--bor);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.p-obs.open{display:block}
.p-tog{font-size:10px;color:var(--teal);cursor:pointer;margin-top:2px;display:inline-block;font-weight:600}
.p-btns{display:flex;flex-direction:column;gap:3px;align-items:center;flex-shrink:0;margin-left:2px}
.p-br{display:flex;gap:2px}
.ob{background:none;border:none;font-size:13px;cursor:pointer;padding:1px 4px;color:var(--teal);line-height:1}
.ob:disabled{opacity:.2;cursor:default}
.ck{width:24px;height:24px;border-radius:50%;border:2px solid var(--bor);background:none;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:var(--txt)}
.ck.done{background:var(--teal);border-color:var(--teal);color:var(--bg)}
.da{display:flex;gap:6px;justify-content:flex-end;margin-top:10px;padding-top:8px;border-top:1px solid var(--bor)}
.bs{background:var(--bg);border:1px solid var(--bor);border-radius:8px;color:var(--mut);font-size:11px;padding:6px 11px;cursor:pointer}

/* ── MAPA PAGE ── */
#mapa-pg{position:fixed;inset:0;padding-top:var(--st);display:none;flex-direction:column;background:var(--bg);z-index:99}
#mapa-pg.on{display:flex}
.m-top{flex-shrink:0;padding:12px 16px 10px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--bor)}
.m-dias{flex-shrink:0;display:flex;gap:6px;padding:10px 16px;overflow-x:auto;border-bottom:1px solid var(--bor)}
.m-dias::-webkit-scrollbar{display:none}
.m-btn{flex-shrink:0;background:var(--sur);border:1px solid var(--bor);border-radius:99px;font-size:11px;padding:7px 14px;cursor:pointer;color:var(--mut);white-space:nowrap;user-select:none}
.m-btn.on{background:var(--teal);border-color:var(--teal);color:var(--bg);font-weight:700}
#m-list{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:10px 16px calc(var(--sb)+16px)}
#m-map{width:100%;height:300px;background:var(--sur);border-radius:14px;margin:0 0 16px;flex-shrink:0;overflow:hidden}
.m-status{padding:4px 0 8px;font-size:11px;color:var(--mut);text-align:center}
.rc{background:var(--sur);border:1px solid var(--bor);border-radius:14px;padding:14px;margin-bottom:12px}
.rc-t{font-size:15px;font-weight:700;margin-bottom:3px}
.rc-s{font-size:11px;color:var(--mut);margin-bottom:10px}
.btn-gmaps-full{display:flex;align-items:center;justify-content:center;gap:8px;background:#1A73E8;border:none;border-radius:10px;color:#fff;font-size:13px;font-weight:700;padding:12px;cursor:pointer;text-decoration:none;width:100%}
.mr{display:flex;align-items:flex-start;gap:10px;padding:10px 0;border-bottom:1px solid var(--bor)}
.mr:last-child{border-bottom:none}
.mr-lh{display:flex;flex-direction:column;align-items:center;flex-shrink:0}
.mr-n{width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:#fff;flex-shrink:0}
.mr-ln{width:2px;flex:1;min-height:16px;background:var(--bor);margin-top:3px}
.mr-info{flex:1;min-width:0}
.mr-nm{font-size:13px;font-weight:600;margin-bottom:2px}
.mr-mt{font-size:11px;color:var(--mut)}
.mr-obs{font-size:11px;color:var(--mut);margin-top:4px;line-height:1.5;background:var(--bg);border-radius:8px;padding:5px 8px;border-left:2px solid var(--bor);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.mr-obs.open{display:block}
.btn-gm{display:inline-flex;align-items:center;gap:4px;background:#1A73E8;border:none;border-radius:7px;color:#fff;font-size:11px;font-weight:600;padding:5px 10px;cursor:pointer;text-decoration:none;margin-top:5px}
.leaflet-container{background:#1A1A2E!important}
.leaflet-popup-content-wrapper{background:var(--sur)!important;color:var(--txt)!important;border:1px solid var(--bor)!important;border-radius:10px!important;box-shadow:0 4px 16px rgba(0,0,0,.5)!important}
.leaflet-popup-tip{background:var(--sur)!important}
.leaflet-popup-content{margin:9px 12px!important;font-size:12px!important}

/* ── FAB — rodapé fixo ── */
.fab{position:fixed;bottom:calc(var(--sb)+22px);left:50%;transform:translateX(-50%);background:var(--teal);border:none;border-radius:99px;color:var(--bg);font-size:14px;font-weight:700;padding:13px 28px;cursor:pointer;box-shadow:0 4px 20px rgba(78,205,196,.4);z-index:3;white-space:nowrap}
.fab.h{display:none!important}

/* ── MODAIS ── */
.ov{display:none;position:fixed;inset:0;background:rgba(0,0,0,.65);z-index:200;align-items:flex-end;justify-content:center}
.ov.on{display:flex}
.sh{background:var(--sur);border-radius:20px 20px 0 0;padding:18px 16px calc(var(--sb)+22px);width:100%;max-height:92dvh;overflow-y:auto;animation:sup .3s ease}
.hdl{width:34px;height:4px;background:var(--bor);border-radius:99px;margin:0 auto 16px}
.mtit{font-size:16px;font-weight:600;margin-bottom:14px}
.fl{font-size:10px;letter-spacing:1.5px;color:var(--mut);display:block;margin-bottom:4px}
.fi{width:100%;background:var(--bg);border:1px solid var(--bor);border-radius:8px;color:var(--txt);font-size:15px;padding:11px 12px;margin-bottom:12px;outline:none;font-family:inherit;-webkit-appearance:none}
.fi:focus{border-color:var(--teal)}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pills{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:12px}
.tpills{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;margin-bottom:12px}
.pill{background:var(--bg);border:1px solid var(--bor);border-radius:99px;color:var(--txt);padding:6px 10px;font-size:11px;cursor:pointer;display:flex;gap:3px;align-items:center;justify-content:center}
.pill.on{border-color:var(--pc);background:color-mix(in srgb,var(--pc) 18%,transparent)}
.br{display:flex;gap:8px;margin-top:4px}
.bc{flex:1;background:var(--bg);border:1px solid var(--bor);border-radius:10px;color:var(--mut);font-size:14px;padding:12px;cursor:pointer}
.bok{flex:2;background:var(--teal);border:none;border-radius:10px;color:var(--bg);font-size:15px;padding:13px;cursor:pointer;font-weight:700}
.bok:disabled{background:#1A2A2A;color:#2A4A4A;cursor:default}
.tg-r{display:flex;align-items:center;justify-content:space-between;background:var(--bg);border:1px solid var(--bor);border-radius:8px;padding:11px 12px;margin-bottom:12px;cursor:pointer}
.tg-sw{width:40px;height:22px;background:var(--bor);border-radius:99px;position:relative;transition:background .2s;flex-shrink:0}
.tg-sw.on{background:var(--teal)}
.tg-sw::after{content:'';position:absolute;width:16px;height:16px;background:#fff;border-radius:50%;top:3px;left:3px;transition:left .2s}
.tg-sw.on::after{left:21px}
.cov{display:none;position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:300;align-items:flex-end;justify-content:center}
.cov.on{display:flex}
.csh{background:var(--sur);border-radius:20px 20px 0 0;padding:18px 16px calc(var(--sb)+18px);width:100%;max-height:80dvh;display:flex;flex-direction:column;animation:sup .3s ease}
.csh-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.csh-t{font-size:12px;color:var(--mut);margin-bottom:12px;padding-bottom:12px;border-bottom:1px solid var(--bor)}
.csh-l{overflow-y:auto;flex:1}
.ci{background:var(--bg);border:1px solid var(--bor);border-left:3px solid var(--c,var(--teal));border-radius:10px;padding:11px 12px;display:flex;justify-content:space-between;margin-bottom:7px}
.eov{display:none;position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:400;align-items:center;justify-content:center;padding:20px}
.eov.on{display:flex}
.ebox{background:var(--sur);border-radius:16px;padding:22px;width:100%;max-width:360px;animation:zin .25s ease}
.ebox h3{font-size:15px;font-weight:600;margin-bottom:16px}
.toast{position:fixed;bottom:calc(var(--sb)+90px);left:50%;transform:translateX(-50%) translateY(16px);background:var(--sur);border:1px solid var(--bor);border-radius:99px;padding:9px 18px;font-size:12px;opacity:0;transition:all .25s;pointer-events:none;z-index:999;white-space:nowrap}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
@keyframes sup{from{transform:translateY(100%)}to{transform:translateY(0)}}
@keyframes zin{from{opacity:0;transform:scale(.95)}to{opacity:1;transform:none}}
::-webkit-scrollbar{width:3px}::-webkit-scrollbar-thumb{background:var(--bor);border-radius:99px}
input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none}
</style>
</head>
<body>

<div id="shell">
  <div id="topbar">
    <div class="tb-row">
      <div>
        <div class="trip-lbl">Controle de Viagem</div>
        <div class="trip-nm" id="tnm"><span id="tnmt">—</span><span style="font-size:13px;opacity:.5">✏️</span></div>
        <div class="chips" id="chips"></div>
      </div>
      <div class="bud-box">
        <div class="bud-lbl">Orçamento</div>
        <div class="bud-val" id="bval">—</div>
      </div>
    </div>
    <div class="prog"><div class="prog-b" id="pb" style="width:0%"></div></div>
    <div class="prog-inf">
      <span>Gasto: <strong id="tv" style="color:var(--teal)">R$ 0</strong></span>
      <span id="rv"></span>
    </div>
  </div>

  <div id="tabs">
    <div class="tab on" data-t="dash">📊</div>
    <div class="tab" data-t="lanc">📋</div>
    <div class="tab" data-t="rot">🗺️ Roteiro</div>
    <div class="tab" data-t="mapa">📍 Mapa</div>
  </div>

  <div id="pages">
    <div class="pg on" id="pg-dash"></div>
    <div class="pg" id="pg-lanc">
      <div class="lh"><span id="lc" style="font-size:11px;color:var(--mut)"></span><span id="fcl" style="font-size:11px;color:var(--teal);cursor:pointer;display:none">Limpar ×</span></div>
      <div id="gl"></div>
    </div>
    <div class="pg" id="pg-rot"><div id="rw"></div></div>
    <div class="pg" id="pg-mapa-placeholder"></div>
  </div>

  <button class="fab h" id="fab">＋ Adicionar Gasto</button>
</div>

<!-- MAPA FULLSCREEN -->
<div id="mapa-pg">
  <div class="m-top">
    <button id="mback" style="background:var(--sur);border:1px solid var(--bor);border-radius:99px;color:var(--txt);font-size:12px;padding:6px 13px;cursor:pointer;flex-shrink:0">← Voltar</button>
    <div id="mhdr" style="font-size:13px;font-weight:600;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">📍 Rota do Dia</div>
  </div>
  <div class="m-dias" id="mdias"></div>
  <div id="m-list"></div>
</div>

<!-- MODAL GASTO -->
<div class="ov" id="og"><div class="sh">
  <div class="hdl"></div><div class="mtit" id="ogt">Novo Gasto</div>
  <label class="fl">DESCRIÇÃO</label><input class="fi" id="fd" type="text" autocomplete="off" placeholder="Ex: Almoço..."/>
  <div class="g2">
    <div><label class="fl">VALOR (R$)</label><input class="fi" id="fv" type="number" min="0.01" step="0.01" placeholder="0,00" style="color:var(--yel);font-weight:700"/></div>
    <div><label class="fl">DATA</label><input class="fi" id="fdt" type="date" style="color-scheme:dark"/></div>
  </div>
  <label class="fl">OBSERVAÇÃO</label><input class="fi" id="fo" type="text" autocomplete="off" placeholder="Detalhes..."/>
  <label class="fl">CATEGORIA</label>
  <div class="pills" id="cpills"></div>
  <button class="bok" id="gok" style="width:100%" disabled>Salvar</button>
</div></div>

<!-- MODAL DIA -->
<div class="ov" id="od"><div class="sh">
  <div class="hdl"></div><div class="mtit" id="odt">Novo Dia</div>
  <label class="fl">TÍTULO</label><input class="fi" id="dt" type="text" autocomplete="off" placeholder="Ex: Lisboa — chegada"/>
  <div class="g2">
    <div><label class="fl">Nº DO DIA</label><input class="fi" id="dn" type="number" min="0" placeholder="1"/></div>
    <div><label class="fl">DATA</label><input class="fi" id="dd" type="date" style="color-scheme:dark"/></div>
  </div>
  <label class="fl">DESCRIÇÃO</label><input class="fi" id="ddc" type="text" autocomplete="off" placeholder="Resumo..."/>
  <div class="br"><button class="bc" id="dcnc">Cancelar</button><button class="bok" id="dok">Salvar Dia</button></div>
</div></div>

<!-- MODAL PARADA -->
<div class="ov" id="op"><div class="sh">
  <div class="hdl"></div><div class="mtit" id="opt">Nova Parada</div>
  <label class="fl">NOME</label><input class="fi" id="pn" type="text" autocomplete="off" placeholder="Ex: Torre de Belém"/>
  <label class="fl">TIPO</label><div class="tpills" id="tpills"></div>
  <label class="fl">HORÁRIO</label><input class="fi" id="ph" type="time" style="color-scheme:dark;color:var(--teal)"/>
  <label class="fl">ENDEREÇO</label><input class="fi" id="pe" type="text" autocomplete="off" placeholder="Opcional"/>
  <label class="fl">LINK GOOGLE MAPS</label><input class="fi" id="pg" type="url" placeholder="https://maps.app.goo.gl/..." style="font-size:13px"/>
  <label class="fl">OBSERVAÇÃO</label><textarea class="fi" id="po" rows="3" style="resize:none;line-height:1.5;font-size:14px" placeholder="Reserva, dica..."></textarea>
  <div class="tg-r" id="rtog"><span style="font-size:13px">✅ Marcar como realizado</span><div class="tg-sw" id="rsw"></div></div>
  <div class="br"><button class="bc" id="pcnc">Cancelar</button><button class="bok" id="pok">Salvar Parada</button></div>
</div></div>

<!-- POPUP CAT -->
<div class="cov" id="ocm"><div class="csh">
  <div class="hdl"></div>

  <label class="fl">NOME</label><input class="fi" id="evn" type="text" autocomplete="off"/>
  <label class="fl">ORÇAMENTO (R$)</label><input class="fi" id="evo" type="number" min="0" step="0.01"/>

<script>
const CATS=[
  {id:'hospedagem', label:'Hospedagem', e:'🏨',c:'#FF6B6B'},
  {id:'transporte', label:'Transporte', e:'✈️',c:'#4ECDC4'},
  {id:'alimentacao',label:'Alimentação',e:'🍽️',c:'#FFE66D'},
  {id:'passeios',   label:'Passeios',  e:'🎡',c:'#A8E6CF'},
  {id:'compras',    label:'Compras',   e:'🛍️',c:'#FF8B94'},
  {id:'outros',     label:'Outros',    e:'📦',c:'#C3B1E1'},
];
const TIPOS=[
  {id:'hotel',      label:'Hotel',      e:'🏨',c:'#FF6B6B'},
  {id:'restaurante',label:'Restaurante',e:'🍽️',c:'#FFE66D'},
  {id:'atração',    label:'Atração',    e:'🎡',c:'#4ECDC4'},
  {id:'transporte', label:'Transporte', e:'✈️',c:'#A8E6CF'},
  {id:'compras',    label:'Compras',    e:'🛍️',c:'#FF8B94'},
  {id:'outro',      label:'Outro',      e:'📍',c:'#C3B1E1'},
];
const PC=['#FF6B6B','#4ECDC4','#FFE66D','#A8E6CF','#FF8B94','#C3B1E1','#F7DC6F','#82E0AA','#F1948A','#85C1E9'];
const R=v=>new Intl.NumberFormat('pt-BR',{style:'currency',currency:'BRL'}).format(v);
const $=id=>document.getElementById(id);

let sb,vid=null,gastos=[],viagens=[];
let fcat=null,egid=null;
let rDias=[],rPars=[],dopen={};
let deid=null,peid=null,daid=null,rmod=false;
let lmap=null,lmks=[],lln=null;

// ── INIT ──────────────────────────────────────────────
(async()=>{
  sb=supabase.createClient(
    'https://evvvzmnguhgqaopvquhs.supabase.co',
    'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImV2dnZ6bW5ndWhncWFvcHZxdWhzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzkyMTMzODYsImV4cCI6MjA5NDc4OTM4Nn0.FSuRZjedHmJs4QRiCrk_DS1tzEO-tOU3pN8HG15Iw5g'
  );

})();

// ── VIAGENS ───────────────────────────────────────────
async function loadViagens(){
  const{data}=await sb.from('viagens').select('*').order('criado_em',{ascending:false});
  viagens=data||[];
  if(!viagens.length)return;
  vid=viagens[0].id;
  drawChips();await loadGastos();
}
function drawChips(){
  const el=$('chips');el.innerHTML='';
  viagens.forEach(v=>{
    const c=document.createElement('div');c.className='chip'+(v.id===vid?' on':'');
    c.textContent=v.nome;c.onclick=async()=>{vid=v.id;drawChips();await loadGastos();};
    el.appendChild(c);
  });
  const a=document.createElement('div');a.className='chip add';a.textContent='+ nova';
  a.onclick=async()=>{
    const n=prompt('Nome:');if(!n)return;
    const o=parseFloat(prompt('Orçamento:')||'0');
    const{data,e}=await sb.from('viagens').insert({nome:n,orcamento:o}).select().single();
    if(e){toast('Erro');return;}viagens.unshift(data);vid=data.id;drawChips();await loadGastos();
  };el.appendChild(a);
}
$('tnm').onclick=()=>{
  const v=viagens.find(x=>x.id===vid);if(!v)return;
  $('evn').value=v.nome;$('evo').value=v.orcamento;
  $('oev').classList.add('on');setTimeout(()=>$('evn').focus(),100);
};
$('evcnc').onclick=()=>$('oev').classList.remove('on');
$('oev').onclick=e=>{if(e.target===$('oev'))$('oev').classList.remove('on');};
$('evok').onclick=async()=>{
  const n=$('evn').value.trim();if(!n)return;
  const o=parseFloat($('evo').value)||0;
  const v=viagens.find(x=>x.id===vid);if(!v)return;
  v.nome=n;v.orcamento=o;$('tnmt').textContent=n;drawChips();drawTop();
  $('oev').classList.remove('on');toast('Viagem atualizada ✓');
  await sb.from('viagens').update({nome:n,orcamento:o}).eq('id',vid);
};

// ── GASTOS ────────────────────────────────────────────
async function loadGastos(){
  const v=viagens.find(x=>x.id===vid);if(!v)return;
  $('tnmt').textContent=v.nome;
  const{data}=await sb.from('gastos').select('*').eq('viagem_id',vid).order('data',{ascending:false});
  gastos=data||[];drawTop();drawDash();drawList();
}
function drawTop(){
  const v=viagens.find(x=>x.id===vid);
  const tot=gastos.reduce((s,g)=>s+Number(g.valor),0);
  const orc=v?.orcamento||0;const rst=orc-tot;
  const pct=orc?Math.min(tot/orc*100,100):0;
  const cor=pct>90?'#FF6B6B':pct>70?'#FFE66D':'#4ECDC4';
  $('tv').textContent=R(tot);$('tv').style.color=cor;
  $('bval').textContent=R(orc);
  $('rv').textContent=rst>=0?`Restam ${R(rst)}`:`Excedido ${R(-rst)}`;
  $('rv').style.color=rst>=0?'#4ECDC4':'#FF6B6B';
  $('pb').style.width=pct+'%';$('pb').style.background=cor;
}
$('bval').onclick=async()=>{
  const v=viagens.find(x=>x.id===vid);if(!v)return;
  const n=parseFloat(prompt('Novo orçamento:',v.orcamento)||v.orcamento);
  if(isNaN(n)||n<0)return;v.orcamento=n;drawTop();toast('✓');
  await sb.from('viagens').update({orcamento:n}).eq('id',vid);
};

// ── DASHBOARD ─────────────────────────────────────────
function drawDash(){
  const el=$('pg-dash');el.innerHTML='';
  const tot=gastos.reduce((s,g)=>s+Number(g.valor),0);
  const bc=CATS.map(c=>({...c,tot:gastos.filter(g=>g.categoria===c.id).reduce((s,g)=>s+Number(g.valor),0)}));
  const mx=Math.max(...bc.map(c=>c.tot),1);
  // cat grid
  el.innerHTML+='<div class="sec">Por Categoria</div>';
  const gr=document.createElement('div');gr.className='cat-grid';
  bc.forEach(c=>{
    const d=document.createElement('div');d.className='cat-card';
    d.innerHTML=`<div class="i">${c.e}</div><div class="l">${c.label}</div><div class="v" style="color:${c.tot?c.c:'#333'}">${c.tot?R(c.tot):'—'}</div>`;
    d.onclick=()=>openCat(c.id);gr.appendChild(d);
  });
  el.appendChild(gr);
  // stats
  const v=viagens.find(x=>x.id===vid);const orc=v?.orcamento||0;
  const dias=[...new Set(gastos.map(g=>g.data))].length;
  const maior=gastos.length?gastos.reduce((a,b)=>Number(a.valor)>Number(b.valor)?a:b):null;
  const sg=document.createElement('div');sg.className='sg';
  sg.innerHTML=`
    <div class="sc"><div class="sl">Total Gasto</div><div class="sv" style="color:var(--teal)">${R(tot)}</div><div class="ss">${orc?Math.round(tot/orc*100)+'% do orçamento':'—'}</div></div>
    <div class="sc"><div class="sl">Lançamentos</div><div class="sv">${gastos.length}</div><div class="ss">${dias} dia${dias!==1?'s':''}</div></div>
    <div class="sc"><div class="sl">Ticket Médio</div><div class="sv" style="color:var(--yel)">${gastos.length?R(tot/gastos.length):'—'}</div><div class="ss">por lançamento</div></div>
    <div class="sc"><div class="sl">Maior Gasto</div><div class="sv" style="color:var(--red)">${maior?R(maior.valor):'—'}</div><div class="ss">${maior?maior.descricao.slice(0,16):'—'}</div></div>`;
  el.appendChild(sg);
  // donut
  el.innerHTML+='<div class="sec" style="margin-top:4px">Distribuição</div>';
  const dw=document.createElement('div');dw.className='donut-w';
  dw.innerHTML='<svg id="dsv" width="110" height="110" viewBox="0 0 110 110"></svg><div class="leg" id="dlg"></div>';
  el.appendChild(dw);buildDonut(bc,tot);
  // bars
  el.innerHTML+='<div class="sec">Por Categoria</div>';
  const bw=document.createElement('div');
  bc.filter(c=>c.tot>0).sort((a,b)=>b.tot-a.tot).forEach(c=>{
    const p=c.tot/mx*100;
    const rw=document.createElement('div');rw.className='bar-r';
    rw.innerHTML=`<div class="n">${c.e} ${c.label}</div><div class="bar-t"><div class="bar-f" style="width:${p}%;background:${c.c}"></div></div><div class="a" style="color:${c.c}">${R(c.tot)}</div>`;
    bw.appendChild(rw);
  });
  if(!bc.some(c=>c.tot>0))bw.innerHTML='<div style="color:#333;text-align:center;padding:16px;font-size:12px">Nenhum dado ainda</div>';
  el.appendChild(bw);
}
function buildDonut(bc,tot){
  const svg=$('dsv'),leg=$('dlg');if(!svg)return;
  svg.innerHTML='';leg.innerHTML='';
  const has=bc.filter(c=>c.tot>0);
  if(!has.length){svg.innerHTML='<circle cx="55" cy="55" r="38" fill="none" stroke="#2A2A3E" stroke-width="18"/>';return;}
  let a=-Math.PI/2;const R2=38,cx=55,cy=55;
  has.forEach(c=>{
    const sl=c.tot/tot*2*Math.PI;
    const x1=cx+R2*Math.cos(a),y1=cy+R2*Math.sin(a);
    const x2=cx+R2*Math.cos(a+sl),y2=cy+R2*Math.sin(a+sl);
    const p=document.createElementNS('http://www.w3.org/2000/svg','path');
    p.setAttribute('d',`M ${cx} ${cy} L ${x1} ${y1} A ${R2} ${R2} 0 ${sl>Math.PI?1:0} 1 ${x2} ${y2} Z`);
    p.setAttribute('fill',c.c);svg.appendChild(p);
    const h=document.createElementNS('http://www.w3.org/2000/svg','circle');
    h.setAttribute('cx',cx);h.setAttribute('cy',cy);h.setAttribute('r',20);h.setAttribute('fill','#0F0F1A');
    svg.appendChild(h);a+=sl;
    leg.innerHTML+=`<div class="leg-r"><div class="leg-d" style="background:${c.c}"></div><span>${c.e} ${c.label}</span><span style="margin-left:auto;color:${c.c}">${Math.round(c.tot/tot*100)}%</span></div>`;
  });
}

// ── CAT POPUP ─────────────────────────────────────────
function openCat(cid){
  const c=CATS.find(x=>x.id===cid);
  const it=gastos.filter(g=>g.categoria===cid).sort((a,b)=>new Date(b.data)-new Date(a.data));
  const tc=it.reduce((s,g)=>s+Number(g.valor),0);
  const tg=gastos.reduce((s,g)=>s+Number(g.valor),0);
  $('cmt').innerHTML=`<span>${c.e}</span><span>${c.label}</span>`;
  $('cmtot').innerHTML=`<strong style="color:${c.c};font-size:18px">${R(tc)}</strong><span style="margin-left:8px">${it.length} lançamento${it.length!==1?'s':''} · ${tg?Math.round(tc/tg*100):0}%</span>`;
  $('cml').innerHTML=it.map(g=>`<div class="ci" style="--c:${c.c}"><div><div style="font-size:13px">${g.descricao}</div><div style="font-size:10px;color:var(--mut)">${g.data?g.data.split('-').reverse().join('/'):''}${g.observacao?' · '+g.observacao:''}</div></div><div style="font-size:14px;font-weight:700;color:${c.c};margin-left:10px">${R(Number(g.valor))}</div></div>`).join('')||'<div style="text-align:center;padding:24px;color:#333">Nenhum gasto</div>';
  $('ocm').classList.add('on');
}
$('cmcl').onclick=()=>$('ocm').classList.remove('on');
$('ocm').onclick=e=>{if(e.target===$('ocm'))$('ocm').classList.remove('on');};

// ── LIST ──────────────────────────────────────────────
function drawList(){
  const fl=fcat?gastos.filter(g=>g.categoria===fcat):gastos;
  const cat=fcat?CATS.find(c=>c.id===fcat):null;
  $('lc').textContent=cat?`${cat.e} ${cat.label} — ${fl.length} lançamento${fl.length!==1?'s':''}`:`${fl.length} lançamento${fl.length!==1?'s':''}`;
  $('fcl').style.display=fcat?'':'none';
  const el=$('gl');el.innerHTML='';
  if(!fl.length){el.innerHTML='<div style="text-align:center;padding:40px 0;color:#444"><div style="font-size:36px;margin-bottom:10px">🗺️</div><div style="font-size:13px">Nenhum lançamento</div></div>';return;}
  fl.forEach(g=>{
    const c=CATS.find(x=>x.id===g.categoria)||CATS[5];
    const d=document.createElement('div');d.className='gi';d.style.setProperty('--c',c.c);
    d.innerHTML=`<div class="gl"><span style="font-size:20px">${c.e}</span><div><div style="font-size:13px;font-weight:500">${g.descricao}</div><div style="font-size:10px;color:var(--mut)">${g.data?g.data.split('-').reverse().join('/'):''}${g.observacao?' · '+g.observacao:''}</div></div></div><div class="gr"><span style="font-size:14px;font-weight:700;color:${c.c}">${R(Number(g.valor))}</span><div style="display:flex;gap:4px"><button class="bi">✏️</button><button class="bi">🗑️</button></div></div>`;
    d.querySelectorAll('.bi')[0].onclick=()=>editG(g.id);
    d.querySelectorAll('.bi')[1].onclick=()=>delG(g.id);
    el.appendChild(d);
  });
}
$('fcl').onclick=()=>{fcat=null;drawDash();drawList();};

// ── MODAL GASTO ───────────────────────────────────────
CATS.forEach(c=>{
  const p=document.createElement('div');p.className='pill';p.dataset.id=c.id;
  p.style.setProperty('--pc',c.c);p.innerHTML=`${c.e} ${c.label}`;
  p.onclick=()=>{document.querySelectorAll('#cpills .pill').forEach(x=>x.classList.remove('on'));p.classList.add('on');chkg();};
  $('cpills').appendChild(p);
});
$('fdt').value=new Date().toISOString().split('T')[0];
document.querySelector('#cpills .pill').classList.add('on');
function chkg(){$('gok').disabled=!($('fd').value.trim()&&$('fv').value>0);}
['fd','fv','fo'].forEach(id=>$(id).oninput=chkg);
$('fab').onclick=()=>{
  egid=null;$('ogt').textContent='Novo Gasto';
  $('fd').value='';$('fv').value='';$('fo').value='';
  $('fdt').value=new Date().toISOString().split('T')[0];
  document.querySelectorAll('#cpills .pill').forEach(x=>x.classList.remove('on'));
  document.querySelector('#cpills .pill').classList.add('on');
  chkg();$('og').classList.add('on');setTimeout(()=>$('fd').focus(),100);
};
$('og').onclick=e=>{if(e.target===$('og'))$('og').classList.remove('on');};
function editG(id){
  const g=gastos.find(x=>x.id===id);if(!g)return;
  egid=id;$('ogt').textContent='Editar Gasto';
  $('fd').value=g.descricao;$('fv').value=Number(g.valor);
  $('fo').value=g.observacao||'';$('fdt').value=g.data;
  document.querySelectorAll('#cpills .pill').forEach(p=>p.classList.toggle('on',p.dataset.id===g.categoria));
  chkg();$('og').classList.add('on');
}
$('gok').onclick=async()=>{
  const descricao=$('fd').value.trim(),valor=parseFloat($('fv').value);
  const observacao=$('fo').value.trim()||null,data=$('fdt').value;
  const categoria=document.querySelector('#cpills .pill.on')?.dataset.id;
  if(!descricao||!valor||!categoria)return;
  if(egid){
    const i=gastos.findIndex(x=>x.id===egid);
    if(i!==-1)gastos[i]={...gastos[i],descricao,valor,observacao,data,categoria};
    drawTop();drawDash();drawList();$('og').classList.remove('on');toast('Atualizado ✓');
    await sb.from('gastos').update({descricao,valor,observacao,data,categoria}).eq('id',egid);
  }else{
    const tmp='t'+Date.now();
    gastos.unshift({id:tmp,viagem_id:vid,descricao,valor,observacao,data,categoria});
    drawTop();drawDash();drawList();$('og').classList.remove('on');toast('Adicionado ✓');
    const{data:ins,error}=await sb.from('gastos').insert({viagem_id:vid,descricao,valor,observacao,data,categoria}).select().single();
    if(error){gastos=gastos.filter(g=>g.id!==tmp);drawTop();drawDash();drawList();toast('Erro ⚠️');}
    else{const i=gastos.findIndex(g=>g.id===tmp);if(i!==-1)gastos[i]=ins;}
  }
};
async function delG(id){
  if(!confirm('Excluir?'))return;
  const bk=[...gastos];gastos=gastos.filter(g=>g.id!==id);drawTop();drawDash();drawList();toast('Excluído ✓');
  const{error}=await sb.from('gastos').delete().eq('id',id);
  if(error){gastos=bk;drawTop();drawDash();drawList();toast('Erro ⚠️');}
}

// ── ROTEIRO ───────────────────────────────────────────
async function loadRot(){
  const{data:dias}=await sb.from('roteiro_dias').select('*').eq('viagem_id',vid).order('numero');
  rDias=dias||[];
  if(rDias.length){
    const{data:pars}=await sb.from('roteiro_paradas').select('*').in('dia_id',rDias.map(d=>d.id)).order('ordem');
    rPars=pars||[];
  }else rPars=[];
}
function drawRot(){
  const el=$('rw');el.innerHTML='';
  const ab=document.createElement('button');ab.className='bs';
  ab.style.cssText='width:100%;margin-bottom:12px;padding:10px;color:var(--teal);border-color:var(--teal);font-size:13px;font-weight:600';
  ab.textContent='+ Adicionar Dia';ab.onclick=()=>openDia(null);el.appendChild(ab);
  if(!rDias.length){el.innerHTML+='<div style="text-align:center;padding:40px 0;color:#444"><div style="font-size:36px;margin-bottom:10px">🗺️</div><div>Nenhum dia</div></div>';return;}
  rDias.forEach(dia=>{
    const pars=[...rPars.filter(p=>p.dia_id===dia.id)].sort((a,b)=>a.ordem-b.ordem);
    const ab2=dopen[dia.id]!==false;
    const dtf=dia.data?new Date(dia.data+'T12:00').toLocaleDateString('pt-BR',{weekday:'short',day:'2-digit',month:'short'}):'';
    const card=document.createElement('div');card.className='dc';
    const hdr=document.createElement('div');hdr.className='dh';
    hdr.innerHTML=`<span class="db-g">Dia ${dia.numero}</span><span class="db-t">${dia.titulo}</span><span class="db-d">${dtf}</span><span style="color:var(--mut);font-size:10px;flex-shrink:0">${ab2?'▲':'▼'}</span>`;
    hdr.onclick=()=>{dopen[dia.id]=!ab2;drawRot();};card.appendChild(hdr);
    if(ab2){
      const body=document.createElement('div');body.className='db-body';
      if(dia.descricao){const dc=document.createElement('div');dc.className='db-desc';dc.textContent=dia.descricao;body.appendChild(dc);}
      const pw=document.createElement('div');
      if(!pars.length){pw.innerHTML='<div style="font-size:11px;color:#444;padding:8px 0">Sem paradas — adicione abaixo</div>';}
      else{
        pars.forEach((p,i)=>{
          const t=TIPOS.find(x=>x.id===p.tipo)||TIPOS[5];
          const row=document.createElement('div');row.className='pi';
          const lh=document.createElement('div');lh.className='p-lh';
          const dot=document.createElement('div');dot.className='p-dot';
          dot.style.cssText=`background:color-mix(in srgb,${t.c} 18%,transparent);border:2px solid ${t.c}`;
          dot.textContent=t.e;lh.appendChild(dot);
          if(i<pars.length-1){const ln=document.createElement('div');ln.className='p-line';lh.appendChild(ln);}
          row.appendChild(lh);
          const info=document.createElement('div');info.className='p-info';
          const nm=document.createElement('div');nm.className='p-nm'+(p.realizado?' done':'');nm.textContent=p.nome;info.appendChild(nm);
          if(p.horario){const hb=document.createElement('div');hb.className='p-hor';hb.textContent='⏰ '+p.horario;info.appendChild(hb);}
          if(p.endereco){const en=document.createElement('div');en.className='p-end';en.textContent='📍 '+p.endereco;info.appendChild(en);}
          if(p.observacao){
            const obs=document.createElement('div');obs.className='p-obs';obs.textContent='💬 '+p.observacao;info.appendChild(obs);
            if(p.observacao.length>55){
              const tg=document.createElement('span');tg.className='p-tog';tg.textContent='ver mais ▾';
              tg.onclick=e=>{e.stopPropagation();const op=obs.classList.toggle('open');tg.textContent=op?'ver menos ▴':'ver mais ▾';};
              info.appendChild(tg);
            }
          }
          row.appendChild(info);
          // botões
          const btns=document.createElement('div');btns.className='p-btns';
          const ar=document.createElement('div');ar.className='p-br';
          const u=document.createElement('button');u.className='ob';u.textContent='▲';u.disabled=i===0;
          u.onclick=e=>{e.stopPropagation();moverP(dia.id,p.id,-1);};
          const d2=document.createElement('button');d2.className='ob';d2.textContent='▼';d2.disabled=i===pars.length-1;
          d2.onclick=e=>{e.stopPropagation();moverP(dia.id,p.id,+1);};
          ar.appendChild(u);ar.appendChild(d2);btns.appendChild(ar);
          const ar2=document.createElement('div');ar2.className='p-br';
          const ck=document.createElement('button');ck.className='ck'+(p.realizado?' done':'');ck.textContent=p.realizado?'✓':'';
          ck.onclick=()=>togReal(p.id,p.realizado);ar2.appendChild(ck);
          const eb=document.createElement('button');eb.className='bi';eb.textContent='✏️';eb.style.fontSize='14px';eb.onclick=()=>openPar(dia.id,p.id);ar2.appendChild(eb);
          const db2=document.createElement('button');db2.className='bi';db2.textContent='🗑️';db2.style.fontSize='14px';db2.onclick=()=>delPar(p.id);ar2.appendChild(db2);
          btns.appendChild(ar2);row.appendChild(btns);pw.appendChild(row);
        });
      }
      body.appendChild(pw);
      const acts=document.createElement('div');acts.className='da';
      const bp=document.createElement('button');bp.className='bs';bp.style.cssText='color:var(--teal);border-color:var(--teal);font-weight:600';bp.textContent='+ Parada';
      bp.onclick=e=>{e.stopPropagation();openPar(dia.id,null);};acts.appendChild(bp);
      const be=document.createElement('button');be.className='bs';be.textContent='✏️ Dia';be.onclick=e=>{e.stopPropagation();openDia(dia.id);};acts.appendChild(be);
      const bd=document.createElement('button');bd.className='bs';bd.style.color='var(--red)';bd.textContent='🗑️';bd.onclick=e=>{e.stopPropagation();delDia(dia.id);};acts.appendChild(bd);
      body.appendChild(acts);card.appendChild(body);
    }
    el.appendChild(card);
  });
}

// ── MOVER PARADA ──────────────────────────────────────
async function moverP(diaId,parId,dir){
  const lista=[...rPars.filter(p=>p.dia_id===diaId)].sort((a,b)=>a.ordem-b.ordem);
  const idx=lista.findIndex(p=>p.id===parId);
  const ni=idx+dir;
  if(idx===-1||ni<0||ni>=lista.length)return;
  const pA=lista[idx],pB=lista[ni];
  const oA=pA.ordem,oB=pB.ordem;
  const iA=rPars.findIndex(p=>p.id===pA.id);
  const iB=rPars.findIndex(p=>p.id===pB.id);
  rPars[iA].ordem=oB;rPars[iB].ordem=oA;
  drawRot();
  const r1=await sb.from('roteiro_paradas').update({ordem:oB}).eq('id',pA.id);
  const r2=await sb.from('roteiro_paradas').update({ordem:oA}).eq('id',pB.id);
  if(r1.error||r2.error){
    rPars[iA].ordem=oA;rPars[iB].ordem=oB;drawRot();toast('Erro ao salvar ⚠️');
  }else toast('Ordem atualizada ✓');
}

async function togReal(id,atual){
  const i=rPars.findIndex(p=>p.id===id);if(i===-1)return;
  rPars[i].realizado=!atual;drawRot();
  await sb.from('roteiro_paradas').update({realizado:!atual}).eq('id',id);
}

// ── MODAL DIA ─────────────────────────────────────────
function openDia(id){
  deid=id;const dia=id?rDias.find(d=>d.id===id):null;
  $('odt').textContent=dia?'Editar Dia':'Novo Dia';
  $('dt').value=dia?.titulo||'';$('dn').value=dia?.numero??rDias.length;
  $('dd').value=dia?.data||'';$('ddc').value=dia?.descricao||'';
  $('od').classList.add('on');setTimeout(()=>$('dt').focus(),100);
}
$('dcnc').onclick=()=>$('od').classList.remove('on');
$('od').onclick=e=>{if(e.target===$('od'))$('od').classList.remove('on');};
$('dok').onclick=async()=>{
  const titulo=$('dt').value.trim();if(!titulo)return;
  const numero=parseInt($('dn').value)||0;
  const data=$('dd').value||null,descricao=$('ddc').value.trim()||null;
  $('od').classList.remove('on');
  if(deid){
    const i=rDias.findIndex(d=>d.id===deid);if(i!==-1)rDias[i]={...rDias[i],titulo,numero,data,descricao};
    drawRot();toast('Dia atualizado ✓');
    await sb.from('roteiro_dias').update({titulo,numero,data,descricao}).eq('id',deid);
  }else{
    const tmp='t'+Date.now();rDias.push({id:tmp,viagem_id:vid,titulo,numero,data,descricao});
    rDias.sort((a,b)=>a.numero-b.numero);drawRot();toast('Dia adicionado ✓');
    const{data:ins,error}=await sb.from('roteiro_dias').insert({viagem_id:vid,titulo,numero,data,descricao}).select().single();
    if(error){rDias=rDias.filter(d=>d.id!==tmp);drawRot();toast('Erro ⚠️');}
    else{const i=rDias.findIndex(d=>d.id===tmp);if(i!==-1){rDias[i]=ins;drawRot();}}
  }
};
async function delDia(id){
  if(!confirm('Excluir este dia e paradas?'))return;
  rDias=rDias.filter(d=>d.id!==id);rPars=rPars.filter(p=>p.dia_id!==id);
  drawRot();toast('Dia excluído ✓');await sb.from('roteiro_dias').delete().eq('id',id);
}

// ── MODAL PARADA ──────────────────────────────────────
TIPOS.forEach(t=>{
  const p=document.createElement('div');p.className='pill';p.dataset.id=t.id;
  p.style.setProperty('--pc',t.c);p.innerHTML=`${t.e} ${t.label}`;
  p.onclick=()=>{document.querySelectorAll('#tpills .pill').forEach(x=>x.classList.remove('on'));p.classList.add('on');};
  $('tpills').appendChild(p);
});
document.querySelector('#tpills .pill').classList.add('on');
$('rtog').onclick=()=>{rmod=!rmod;$('rsw').classList.toggle('on',rmod);};
function openPar(diaId,parId){
  daid=diaId;peid=parId||null;
  const par=parId?rPars.find(p=>p.id===parId):null;
  $('opt').textContent=par?'Editar Parada':'Nova Parada';
  $('pn').value=par?.nome||'';$('ph').value=par?.horario||'';
  $('pe').value=par?.endereco||'';$('po').value=par?.observacao||'';
  $('pg').value=par?.gmaps_link||'';
  rmod=par?.realizado||false;$('rsw').classList.toggle('on',rmod);
  const tid=par?.tipo||'atração';
  document.querySelectorAll('#tpills .pill').forEach(p=>p.classList.toggle('on',p.dataset.id===tid));
  $('op').classList.add('on');setTimeout(()=>$('pn').focus(),100);
}
$('pcnc').onclick=()=>$('op').classList.remove('on');
$('op').onclick=e=>{if(e.target===$('op'))$('op').classList.remove('on');};
$('pok').onclick=async()=>{
  const nome=$('pn').value.trim();if(!nome)return;
  const horario=$('ph').value||null,endereco=$('pe').value.trim()||null;
  const observacao=$('po').value.trim()||null,realizado=rmod;
  const gmaps_link=$('pg').value.trim()||null;
  const tipo=document.querySelector('#tpills .pill.on')?.dataset.id||'outro';
  const ordem=rPars.filter(p=>p.dia_id===daid).length+1;
  $('op').classList.remove('on');
  if(peid){
    const i=rPars.findIndex(p=>p.id===peid);
    if(i!==-1)rPars[i]={...rPars[i],nome,horario,endereco,observacao,tipo,realizado,gmaps_link};
    drawRot();toast('Parada atualizada ✓');
    await sb.from('roteiro_paradas').update({nome,horario,endereco,observacao,tipo,realizado,gmaps_link}).eq('id',peid);
  }else{
    const tmp='t'+Date.now();
    rPars.push({id:tmp,dia_id:daid,nome,horario,endereco,observacao,tipo,realizado,gmaps_link,ordem});
    drawRot();toast('Parada adicionada ✓');
    const{data:ins,error}=await sb.from('roteiro_paradas').insert({dia_id:daid,nome,horario,endereco,observacao,tipo,realizado,gmaps_link,ordem}).select().single();
    if(error){rPars=rPars.filter(p=>p.id!==tmp);drawRot();toast('Erro ⚠️');}
    else{const i=rPars.findIndex(p=>p.id===tmp);if(i!==-1)rPars[i]=ins;}
  }
};
async function delPar(id){
  if(!confirm('Excluir?'))return;
  rPars=rPars.filter(p=>p.id!==id);drawRot();toast('Excluído ✓');
  await sb.from('roteiro_paradas').delete().eq('id',id);
}

// ── MAPA ──────────────────────────────────────────────
async function initMapa(){
  await loadRot();
  drawMDias();
  if(rDias.length) await drawMDia(rDias[0]);
  else $('m-list').innerHTML='<div style="text-align:center;padding:32px;color:#444">Nenhum dia no roteiro</div>';
}
function drawMDias(){
  const w=$('mdias');w.innerHTML='';
  rDias.forEach((dia,i)=>{
    const b=document.createElement('div');b.className='m-btn'+(i===0?' on':'');
    b.textContent=`Dia ${dia.numero} · ${dia.titulo.split('—')[0].split('&')[0].trim().slice(0,20)}`;
    b.onclick=async()=>{document.querySelectorAll('.m-btn').forEach(x=>x.classList.remove('on'));b.classList.add('on');await drawMDia(dia);};
    w.appendChild(b);
  });
}
async function drawMDia(dia){
  const pars=[...rPars.filter(p=>p.dia_id===dia.id)].sort((a,b)=>a.ordem-b.ordem);
  const el=$('m-list');el.innerHTML='';
  $('mhdr').textContent=`📍 Dia ${dia.numero} · ${dia.titulo}`;
  // limpa mapa
  lmks.forEach(m=>lmap.removeLayer(m));lmks=[];
  if(lln){lmap.removeLayer(lln);lln=null;}
  if(!pars.length){el.innerHTML='<div style="text-align:center;padding:32px;color:#444">Nenhuma parada neste dia</div>';return;}
  // rota card
  const dtf=dia.data?new Date(dia.data+'T12:00').toLocaleDateString('pt-BR',{weekday:'long',day:'2-digit',month:'long'}):'';
  const dest=pars.map(p=>p.gmaps_link&&p.gmaps_link.startsWith('http')?p.gmaps_link:encodeURIComponent((p.endereco||p.nome)+', Portugal'));
  const rurl=pars.length===1?(pars[0].gmaps_link||`https://www.google.com/maps/search/?api=1&query=${dest[0]}`):
    `https://www.google.com/maps/dir/${dest.join('/')}`;
  const rc=document.createElement('div');rc.className='rc';
  rc.innerHTML=`<div class="rc-t">Dia ${dia.numero} · ${dia.titulo}</div><div class="rc-s">${dtf} · ${pars.length} parada${pars.length!==1?'s':''}</div>`;
  const ra=document.createElement('a');ra.className='btn-gmaps-full';ra.href=rurl;ra.target='_blank';ra.rel='noopener';ra.innerHTML='🗺️ Abrir rota completa no Google Maps';
  rc.appendChild(ra);el.appendChild(rc);
  // lista
  const lista=document.createElement('div');lista.style.cssText='background:var(--sur);border:1px solid var(--bor);border-radius:14px;padding:4px 14px;margin-bottom:16px';
  pars.forEach((p,i)=>{
    const t=TIPOS.find(x=>x.id===p.tipo)||TIPOS[5];const cor=PC[i%PC.length];
    const item=document.createElement('div');item.className='mr';
    const lh=document.createElement('div');lh.className='mr-lh';
    const n=document.createElement('div');n.className='mr-n';n.style.background=cor;n.textContent=i+1;lh.appendChild(n);
    if(i<pars.length-1){const ln=document.createElement('div');ln.className='mr-ln';lh.appendChild(ln);}
    item.appendChild(lh);
    const info=document.createElement('div');info.className='mr-info';
    info.innerHTML=`<div class="mr-nm">${t.e} ${p.nome}${p.realizado?' <span style="color:var(--teal);font-size:10px">✓</span>':''}</div><div class="mr-mt">${p.horario?'⏰ '+p.horario+' · ':''}${t.label}</div>`;
    if(p.observacao){
      const ob=document.createElement('div');ob.className='mr-obs';ob.textContent='💬 '+p.observacao;info.appendChild(ob);
      if(p.observacao.length>60){const tg=document.createElement('span');tg.className='p-tog';tg.textContent='ver mais ▾';tg.onclick=()=>{const op=ob.classList.toggle('open');tg.textContent=op?'ver menos ▴':'ver mais ▾';};info.appendChild(tg);}
    }
    const url=p.gmaps_link&&p.gmaps_link.startsWith('http')?p.gmaps_link:`https://www.google.com/maps/search/?api=1&query=${encodeURIComponent((p.endereco||p.nome)+', Portugal')}`;
    const lk=document.createElement('a');lk.className='btn-gm';lk.href=url;lk.target='_blank';lk.rel='noopener';lk.innerHTML='📍 Ver no Maps';info.appendChild(lk);
    item.appendChild(info);lista.appendChild(item);
  });
  el.appendChild(lista);
  // geocodifica e plota
  $('mst').style.display='block';$('mst').textContent='🔍 Localizando paradas no mapa...';
  const coords=[];
  for(let i=0;i<pars.length;i++){
    const p=pars[i];
    const q=p.endereco?`${p.nome}, ${p.endereco}`:`${p.nome}, Portugal`;
    try{
      const r=await fetch(`https://nominatim.openstreetmap.org/search?format=json&limit=1&q=${encodeURIComponent(q)}`,{headers:{'Accept-Language':'pt-BR'}});
      const d=await r.json();
      coords.push(d.length?{p,lat:+d[0].lat,lng:+d[0].lon,ok:true}:{p,ok:false});
    }catch{coords.push({p,ok:false});}
    if(i<pars.length-1)await new Promise(r=>setTimeout(r,350));
  }
  $('mst').style.display='none';
  const found=coords.filter(c=>c.ok);
  if(!found.length)return;
  const lls=[];
  found.forEach((c,i)=>{
    const cor=PC[i%PC.length];const t=TIPOS.find(x=>x.id===c.p.tipo)||TIPOS[5];
    const icon=L.divIcon({
      html:`<div style="width:28px;height:28px;background:${cor};border-radius:50% 50% 50% 0;transform:rotate(-45deg);display:flex;align-items:center;justify-content:center;border:2px solid rgba(255,255,255,.8);box-shadow:0 2px 8px rgba(0,0,0,.5)"><span style="transform:rotate(45deg);font-size:11px;font-weight:700;color:#fff">${i+1}</span></div>`,
      iconSize:[28,28],iconAnchor:[14,28],popupAnchor:[0,-30],className:''
    });
    const mk=L.marker([c.lat,c.lng],{icon}).addTo(lmap);
    mk.bindPopup(`<strong>${i+1}. ${c.p.nome}</strong><br><span style="color:#888;font-size:11px">${t.e} ${t.label}${c.p.horario?' · ⏰ '+c.p.horario:''}</span>`);
    lmks.push(mk);lls.push([c.lat,c.lng]);
  });
  if(lls.length>1)lln=L.polyline(lls,{color:'#4ECDC4',weight:3,opacity:.75,dashArray:'8,5'}).addTo(lmap);
  lmap.fitBounds(L.featureGroup(lmks).getBounds().pad(0.3));
  lmap.invalidateSize();
}

// ── TABS ──────────────────────────────────────────────
document.querySelectorAll('.tab').forEach(tab=>{
  tab.onclick=async()=>{
    const t=tab.dataset.t;
    document.querySelectorAll('.tab').forEach(x=>x.classList.remove('on'));tab.classList.add('on');
    if(t==='mapa'){
      $('mapa-pg').classList.add('on');
      $('fab').classList.add('h');
      await initMapa();
    }else{
      $('mapa-pg').classList.remove('on');
      document.querySelectorAll('.pg').forEach(p=>p.classList.remove('on'));
      $(`pg-${t==='dash'?'dash':t==='lanc'?'lanc':'rot'}`).classList.add('on');
      $('fab').classList.toggle('h',t!=='lanc');
      if(t==='rot'){await loadRot();drawRot();}
    }
  };
});
$('mback').onclick=()=>{
  $('mapa-pg').classList.remove('on');
  document.querySelectorAll('.tab').forEach(x=>x.classList.remove('on'));
  document.querySelector('[data-t="dash"]').classList.add('on');
  document.querySelectorAll('.pg').forEach(p=>p.classList.remove('on'));
  $('pg-dash').classList.add('on');
  $('fab').classList.add('h');
};

// ── TOAST ─────────────────────────────────────────────
function toast(msg,dur=2000){
  const el=$('toast');el.textContent=msg;el.classList.add('show');
  setTimeout(()=>el.classList.remove('show'),dur);
}
</script>
