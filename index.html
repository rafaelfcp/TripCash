<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#0F0F1A;--sur:#1A1A2E;--bor:#2A2A3E;
  --txt:#F0EDE8;--mut:#7A7A8C;--teal:#4ECDC4;
  --yel:#FFE66D;--red:#FF6B6B;
  --st:env(safe-area-inset-top,0px);
  --sb:env(safe-area-inset-bottom,0px);
}
body.light{
  --bg:#F5F5F0;--sur:#FFFFFF;--bor:#E0DDD8;
  --txt:#1A1A2E;--mut:#888899;--teal:#2BAF9F;
  --yel:#D4A800;--red:#D44;
}
html,body{height:100%;background:var(--bg);color:var(--txt);font-family:-apple-system,sans-serif;overflow:hidden}

/* SHELL */
#shell{position:fixed;inset:0;display:flex;flex-direction:column;padding-top:var(--st);z-index:1}

/* TOPBAR */
#topbar{flex-shrink:0;padding:12px 16px 0;background:var(--bg);z-index:2;position:relative}
.tb-row{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.trip-lbl{font-size:10px;letter-spacing:3px;color:var(--teal);text-transform:uppercase;margin-bottom:2px}
.trip-nm{font-size:20px;font-weight:700;cursor:pointer;display:flex;align-items:center;gap:6px;line-height:1.2}
.bud-box{text-align:right;flex-shrink:0}
.bud-lbl{font-size:10px;color:var(--mut)}
.bud-val{font-size:15px;font-weight:700;cursor:pointer}
.prog{margin-top:8px;background:var(--sur);border-radius:99px;height:6px;overflow:hidden}
.prog-b{height:100%;border-radius:99px;transition:width .5s,background .3s}
.prog-inf{display:flex;justify-content:space-between;margin-top:4px;font-size:11px;color:var(--mut);padding-bottom:8px}
.chips{display:flex;gap:6px;flex-wrap:wrap;padding:4px 0 6px}
.chip{background:var(--sur);border:1px solid var(--bor);border-radius:99px;font-size:11px;padding:3px 10px;cursor:pointer;color:var(--mut)}
.chip.on{border-color:var(--teal);color:var(--teal)}
.chip.add{color:var(--teal);border-style:dashed}

/* TABS */
#tabs{flex-shrink:0;display:flex;gap:3px;padding:0 16px 8px;background:var(--bg);z-index:2;position:relative}
.tab{flex:1;background:var(--sur);border:1px solid var(--bor);border-radius:99px;color:var(--mut);font-size:11px;padding:7px 2px;cursor:pointer;text-align:center}
.tab.on{background:var(--teal);border-color:var(--teal);color:var(--bg);font-weight:700}

/* ── PAGES ── */
#pages{flex:1;overflow:hidden;position:relative;min-height:0}
.pg{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;padding:12px 16px calc(var(--sb)+80px);display:none}
.pg.on{display:block}

/* ── DASHBOARD ── */
.sec{font-size:10px;letter-spacing:2px;color:var(--mut);text-transform:uppercase;margin-bottom:8px;margin-top:4px}
.cat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:16px}
.cat-card{background:var(--sur);border:1px solid var(--bor);border-radius:12px;padding:10px 6px;text-align:center;cursor:pointer}
.cat-card .i{font-size:20px}
.cat-card .l{font-size:9px;color:var(--mut);margin-top:2px;text-transform:uppercase;letter-spacing:1px}
.cat-card .v{font-size:11px;margin-top:3px;font-weight:700}
.sg{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:16px}
.sc{background:var(--sur);border:1px solid var(--bor);border-radius:12px;padding:12px}
.sl{font-size:9px;color:var(--mut);text-transform:uppercase;letter-spacing:1px;margin-bottom:4px}
.sv{font-size:17px;font-weight:700}
.ss{font-size:10px;color:var(--mut);margin-top:2px}
.donut-w{display:flex;align-items:center;gap:14px;margin-bottom:16px}
.leg{flex:1}
.leg-r{display:flex;align-items:center;gap:6px;margin-bottom:5px;font-size:11px}
.leg-d{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.bar-r{display:flex;align-items:center;gap:8px;margin-bottom:7px}
.bar-r .n{font-size:11px;width:80px;flex-shrink:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar-t{flex:1;background:var(--sur);border-radius:99px;height:6px;overflow:hidden}
.bar-f{height:100%;border-radius:99px}

const CATS=[

async function loadViagens(){
  const{data}=await sb.from('viagens').select('*').order('criado_em',{ascending:false});
  viagens=data||[];
  if(!viagens.length)return;
  vid=viagens[0].id;
  drawChips();await loadGastos();
}
function drawChips(){
  const el=$('chips');el.innerHTML='';
  viagens.forEach(v=>{
    const c=document.createElement('div');c.className='chip'+(v.id===vid?' on':'');
    c.textContent=v.nome;c.onclick=async()=>{vid=v.id;drawChips();await loadGastos();};
    el.appendChild(c);
  });
  const a=document.createElement('div');a.className='chip add';a.textContent='+ nova';
  a.onclick=async()=>{
    const n=prompt('Nome:');if(!n)return;
    const o=parseFloat(prompt('Orçamento:')||'0');
    const{data,e}=await sb.from('viagens').insert({nome:n,orcamento:o}).select().single();
    if(e){toast('Erro');return;}viagens.unshift(data);vid=data.id;drawChips();await loadGastos();
  };el.appendChild(a);
}
$('tnm').onclick=()=>{
  const v=viagens.find(x=>x.id===vid);if(!v)return;

function drawDash(){

  const tot=gastos.reduce((s,g)=>s+Number(g.valor),0);
  const bc=CATS.map(c=>({...c,tot:gastos.filter(g=>g.categoria===c.id).reduce((s,g)=>s+Number(g.valor),0)}));
  const mx=Math.max(...bc.map(c=>c.tot),1);
  // cat grid
  el.innerHTML+='<div class="sec">Por Categoria</div>';
  const gr=document.createElement('div');gr.className='cat-grid';
  bc.forEach(c=>{
    const d=document.createElement('div');d.className='cat-card';
    d.innerHTML=`<div class="i">${c.e}</div><div class="l">${c.label}</div><div class="v" style="color:${c.tot?c.c:'#333'}">${c.tot?R(c.tot):'—'}</div>`;
    d.onclick=()=>openCat(c.id);gr.appendChild(d);
  });
  el.appendChild(gr);
  // stats
  const v=viagens.find(x=>x.id===vid);const orc=v?.orcamento||0;
  const dias=[...new Set(gastos.map(g=>g.data))].length;
  const maior=gastos.length?gastos.reduce((a,b)=>Number(a.valor)>Number(b.valor)?a:b):null;
  const sg=document.createElement('div');sg.className='sg';
  sg.innerHTML=`
    <div class="sc"><div class="sl">Total Gasto</div><div class="sv" style="color:var(--teal)">${R(tot)}</div><div class="ss">${orc?Math.round(tot/orc*100)+'% do orçamento':'—'}</div></div>
    <div class="sc"><div class="sl">Lançamentos</div><div class="sv">${gastos.length}</div><div class="ss">${dias} dia${dias!==1?'s':''}</div></div>
    <div class="sc"><div class="sl">Ticket Médio</div><div class="sv" style="color:var(--yel)">${gastos.length?R(tot/gastos.length):'—'}</div><div class="ss">por lançamento</div></div>
    <div class="sc"><div class="sl">Maior Gasto</div><div class="sv" style="color:var(--red)">${maior?R(maior.valor):'—'}</div><div class="ss">${maior?maior.descricao.slice(0,16):'—'}</div></div>`;
  el.appendChild(sg);
  // donut
  el.innerHTML+='<div class="sec" style="margin-top:4px">Distribuição</div>';
  const dw=document.createElement('div');dw.className='donut-w';
  dw.innerHTML='<svg id="dsv" width="110" height="110" viewBox="0 0 110 110"></svg><div class="leg" id="dlg"></div>';
  el.appendChild(dw);buildDonut(bc,tot);
  // bars
  el.innerHTML+='<div class="sec">Por Categoria</div>';
  const bw=document.createElement('div');
  bc.filter(c=>c.tot>0).sort((a,b)=>b.tot-a.tot).forEach(c=>{
    const p=c.tot/mx*100;
    const rw=document.createElement('div');rw.className='bar-r';
    rw.innerHTML=`<div class="n">${c.e} ${c.label}</div><div class="bar-t"><div class="bar-f" style="width:${p}%;background:${c.c}"></div></div><div class="a" style="color:${c.c}">${R(c.tot)}</div>`;
    bw.appendChild(rw);
  });
  if(!bc.some(c=>c.tot>0))bw.innerHTML='<div style="color:#333;text-align:center;padding:16px;font-size:12px">Nenhum dado ainda</div>';
  el.appendChild(bw);
}
function buildDonut(bc,tot){
  const svg=$('dsv'),leg=$('dlg');if(!svg)return;
  svg.innerHTML='';leg.innerHTML='';
  const has=bc.filter(c=>c.tot>0);
  if(!has.length){svg.innerHTML='<circle cx="55" cy="55" r="38" fill="none" stroke="#2A2A3E" stroke-width="18"/>';return;}
  let a=-Math.PI/2;const R2=38,cx=55,cy=55;
  has.forEach(c=>{
    const sl=c.tot/tot*2*Math.PI;
    const x1=cx+R2*Math.cos(a),y1=cy+R2*Math.sin(a);
    const x2=cx+R2*Math.cos(a+sl),y2=cy+R2*Math.sin(a+sl);
    const p=document.createElementNS('http://www.w3.org/2000/svg','path');
    p.setAttribute('d',`M ${cx} ${cy} L ${x1} ${y1} A ${R2} ${R2} 0 ${sl>Math.PI?1:0} 1 ${x2} ${y2} Z`);
    p.setAttribute('fill',c.c);svg.appendChild(p);
    const h=document.createElementNS('http://www.w3.org/2000/svg','circle');
    h.setAttribute('cx',cx);h.setAttribute('cy',cy);h.setAttribute('r',20);h.setAttribute('fill','#0F0F1A');
    svg.appendChild(h);a+=sl;
    leg.innerHTML+=`<div class="leg-r"><div class="leg-d" style="background:${c.c}"></div><span>${c.e} ${c.label}</span><span style="margin-left:auto;color:${c.c}">${Math.round(c.tot/tot*100)}%</span></div>`;
  });
}

// ── MOVER PARADA ──────────────────────────────────────
async function moverP(diaId,parId,dir){
  const lista=[...rPars.filter(p=>p.dia_id===diaId)].sort((a,b)=>a.ordem-b.ordem);
  const idx=lista.findIndex(p=>p.id===parId);
  const ni=idx+dir;
  if(idx===-1||ni<0||ni>=lista.length)return;
  const pA=lista[idx],pB=lista[ni];
  const oA=pA.ordem,oB=pB.ordem;
  const iA=rPars.findIndex(p=>p.id===pA.id);
  const iB=rPars.findIndex(p=>p.id===pB.id);
  rPars[iA].ordem=oB;rPars[iB].ordem=oA;
  drawRot();
  const r1=await sb.from('roteiro_paradas').update({ordem:oB}).eq('id',pA.id);
  const r2=await sb.from('roteiro_paradas').update({ordem:oA}).eq('id',pB.id);
  if(r1.error||r2.error){
    rPars[iA].ordem=oA;rPars[iB].ordem=oB;drawRot();toast('Erro ao salvar ⚠️');
  }else toast('Ordem atualizada ✓');
}

async function togReal(id,atual){
  const i=rPars.findIndex(p=>p.id===id);if(i===-1)return;
  rPars[i].realizado=!atual;drawRot();
  await sb.from('roteiro_paradas').update({realizado:!atual}).eq('id',id);
}

  drawRot();toast('Dia excluído ✓');await sb.from('roteiro_dias').delete().eq('id',id);
}

// ── MODAL PARADA ──────────────────────────────────────
TIPOS.forEach(t=>{

  p.style.setProperty('--pc',t.c);p.innerHTML=`${t.e} ${t.label}`;

document.querySelector('#tpills .pill').classList.add('on');
$('rtog').onclick=()=>{rmod=!rmod;$('rsw').classList.toggle('on',rmod);};
function openPar(diaId,parId){
  daid=diaId;peid=parId||null;
  const par=parId?rPars.find(p=>p.id===parId):null;
  $('opt').textContent=par?'Editar Parada':'Nova Parada';

  $('pe').value=par?.endereco||'';$('po').value=par?.observacao||'';
  $('pg').value=par?.gmaps_link||'';

$('pcnc').onclick=()=>$('op').classList.remove('on');

$('pok').onclick=async()=>{
  const nome=$('pn').value.trim();if(!nome)return;
  const horario=$('ph').value||null,endereco=$('pe').value.trim()||null;
  const observacao=$('po').value.trim()||null,realizado=rmod;
  const gmaps_link=$('pg').value.trim()||null;
  const tipo=document.querySelector('#tpills .pill.on')?.dataset.id||'outro';
  const ordem=rPars.filter(p=>p.dia_id===daid).length+1;
  $('op').classList.remove('on');
  if(peid){
    const i=rPars.findIndex(p=>p.id===peid);
    if(i!==-1)rPars[i]={...rPars[i],nome,horario,endereco,observacao,tipo,realizado,gmaps_link};
    drawRot();toast('Parada atualizada ✓');
    await sb.from('roteiro_paradas').update({nome,horario,endereco,observacao,tipo,realizado,gmaps_link}).eq('id',peid);
  }else{
    const tmp='t'+Date.now();
    rPars.push({id:tmp,dia_id:daid,nome,horario,endereco,observacao,tipo,realizado,gmaps_link,ordem});
    drawRot();toast('Parada adicionada ✓');
    const{data:ins,error}=await sb.from('roteiro_paradas').insert({dia_id:daid,nome,horario,endereco,observacao,tipo,realizado,gmaps_link,ordem}).select().single();
    if(error){rPars=rPars.filter(p=>p.id!==tmp);drawRot();toast('Erro ⚠️');}
    else{const i=rPars.findIndex(p=>p.id===tmp);if(i!==-1)rPars[i]=ins;}
  }
};
async function delPar(id){
  if(!confirm('Excluir?'))return;
  rPars=rPars.filter(p=>p.id!==id);drawRot();toast('Excluído ✓');
  await sb.from('roteiro_paradas').delete().eq('id',id);
}

// ── MAPA ──────────────────────────────────────────────
async function initMapa(){
  // inicializa (ou reinicializa) o mapa Leaflet
  if(lmap){lmap.remove();lmap=null;lmks=[];lln=null;}
  lmap=L.map('m-map',{zoomControl:true,attributionControl:false}).setView([39.4,-8.2],7);
  L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png',{maxZoom:19}).addTo(lmap);
  await loadRot();
  drawMDias();
  if(rDias.length) await drawMDia(rDias[0]);
  else $('m-list').innerHTML='<div style="text-align:center;padding:32px;color:#444">Nenhum dia no roteiro</div>';
}
function drawMDias(){
  const w=$('mdias');w.innerHTML='';
  rDias.forEach((dia,i)=>{
    const b=document.createElement('div');b.className='m-btn'+(i===0?' on':'');
    b.textContent=`Dia ${dia.numero} · ${dia.titulo.split('—')[0].split('&')[0].trim().slice(0,20)}`;
    b.onclick=async()=>{document.querySelectorAll('.m-btn').forEach(x=>x.classList.remove('on'));b.classList.add('on');await drawMDia(dia);};
    w.appendChild(b);
  });
}
// ── EXTRAI LAT/LNG DE URL GOOGLE MAPS ─────────────────
function extractCoordsFromGmaps(url){
  if(!url)return null;
  // formato: @lat,lng ou ?q=lat,lng ou /place/.../@lat,lng
  let m;
  // @lat,lng,zoom
  m=url.match(/@(-?\d+\.\d+),(-?\d+\.\d+)/);
  if(m)return{lat:+m[1],lng:+m[2]};
  // ?q=lat,lng
  m=url.match(/[?&]q=(-?\d+\.\d+),(-?\d+\.\d+)/);
  if(m)return{lat:+m[1],lng:+m[2]};
  // /maps/place/.../@lat,lng
  m=url.match(/maps\/place\/[^/@]*\/@(-?\d+\.\d+),(-?\d+\.\d+)/);
  if(m)return{lat:+m[1],lng:+m[2]};
  // ?ll=lat,lng
  m=url.match(/[?&]ll=(-?\d+\.\d+),(-?\d+\.\d+)/);
  if(m)return{lat:+m[1],lng:+m[2]};
  return null;
}

// ── RESOLVE LINK ENCURTADO (goo.gl / maps.app.goo.gl) ─
async function resolveShortLink(url){
  if(!url)return url;
  // links encurtados não contêm coordenadas — tentamos resolver via HEAD no Nominatim proxy
  // como CORS bloqueia a maioria, usamos uma abordagem alternativa:
  // extraímos o destino diretamente da URL se possível, senão retornamos null para cair no Nominatim
  if(url.includes('maps.app.goo.gl')||url.includes('goo.gl/maps')){
    // não conseguimos expandir no browser por CORS — retorna null para usar Nominatim
    return null;
  }
  return url;
}

// ── MONTA URL DE ROTA GOOGLE MAPS COM WAYPOINTS ───────
function buildRouteUrl(pars){
  if(!pars.length)return null;
  // para 1 parada: abre direto no link salvo ou busca por nome
  if(pars.length===1){
    const p=pars[0];
    if(p.gmaps_link&&p.gmaps_link.startsWith('http'))return p.gmaps_link;
    return`https://www.google.com/maps/search/?api=1&query=${encodeURIComponent((p.endereco||p.nome)+', Portugal')}`;
  }
  // para múltiplas: usa formato dir/?api=1 com origin, destination, waypoints (texto)
  // este formato aceita nomes/endereços e funciona bem no mobile
  const labels=pars.map(p=>p.endereco||(p.nome+', Portugal'));
  const origin=encodeURIComponent(labels[0]);
  const destination=encodeURIComponent(labels[labels.length-1]);
  const waypoints=labels.slice(1,-1).map(l=>encodeURIComponent(l)).join('|');
  let url=`https://www.google.com/maps/dir/?api=1&origin=${origin}&destination=${destination}&travelmode=walking`;
  if(waypoints)url+=`&waypoints=${waypoints}`;
  return url;
}

async function drawMDia(dia){
  const pars=[...rPars.filter(p=>p.dia_id===dia.id)].sort((a,b)=>a.ordem-b.ordem);
  const el=$('m-list');el.innerHTML='';
  $('mhdr').textContent=`📍 Dia ${dia.numero} · ${dia.titulo}`;

  // limpa mapa
  lmks.forEach(m=>lmap.removeLayer(m));lmks=[];
  if(lln){lmap.removeLayer(lln);lln=null;}
  if(!pars.length){
    el.innerHTML='<div style="text-align:center;padding:32px;color:#444">Nenhuma parada neste dia</div>';
    return;
  }

  // paradas pendentes (não realizadas) — só essas vão pro mapa
  const parsMap=pars.filter(p=>!p.realizado);

  // rota card — usa apenas pendentes para a rota
  const dtf=dia.data?new Date(dia.data+'T12:00').toLocaleDateString('pt-BR',{weekday:'long',day:'2-digit',month:'long'}):'';
  const rurl=buildRouteUrl(parsMap.length?parsMap:pars);
  const rc=document.createElement('div');rc.className='rc';
  const totTxt=`${pars.length} parada${pars.length!==1?'s':''}`;
  const realTxt=pars.filter(p=>p.realizado).length?` · ✅ ${pars.filter(p=>p.realizado).length} realizada${pars.filter(p=>p.realizado).length!==1?'s':''}`:'' ;
  rc.innerHTML=`<div class="rc-t">Dia ${dia.numero} · ${dia.titulo}</div><div class="rc-s">${dtf} · ${totTxt}${realTxt}</div>`;
  const ra=document.createElement('a');ra.className='btn-gmaps-full';ra.href=rurl;ra.target='_blank';ra.rel='noopener';
  ra.innerHTML='🗺️ Abrir rota completa no Google Maps';
  rc.appendChild(ra);el.appendChild(rc);

  // ── LISTA COMPLETA (todas as paradas, realizadas aparecem riscadas) ──
  const lista=document.createElement('div');
  lista.style.cssText='background:var(--sur);border:1px solid var(--bor);border-radius:14px;padding:4px 14px;margin-bottom:16px';
  pars.forEach((p,i)=>{
    const t=TIPOS.find(x=>x.id===p.tipo)||TIPOS[5];
    const item=document.createElement('div');item.className='mr';
    // número sequencial na lista (cor esmaecida se realizado)
    const cor=p.realizado?'#444':PC[i%PC.length];
    const lh=document.createElement('div');lh.className='mr-lh';
    const n=document.createElement('div');n.className='mr-n';
    n.style.cssText=`background:${cor};${p.realizado?'opacity:.4':''}`;
    n.textContent=i+1;lh.appendChild(n);
    if(i<pars.length-1){const ln=document.createElement('div');ln.className='mr-ln';lh.appendChild(ln);}
    item.appendChild(lh);
    const info=document.createElement('div');info.className='mr-info';
    if(p.realizado)info.style.opacity='.45';
    const hasLink=p.gmaps_link&&p.gmaps_link.startsWith('http');
    const realBadge=p.realizado?'<span style="font-size:9px;background:color-mix(in srgb,var(--teal) 15%,transparent);color:var(--teal);border-radius:4px;padding:1px 5px;border:1px solid color-mix(in srgb,var(--teal) 30%,transparent)">✓ feito</span> ':'';
    const linkBadge=hasLink?'<span style="font-size:9px;background:color-mix(in srgb,#1A73E8 18%,transparent);color:#6AB4F5;border-radius:4px;padding:1px 5px;border:1px solid color-mix(in srgb,#1A73E8 35%,transparent)">📌 link</span>':'';
    info.innerHTML=`<div class="mr-nm" style="${p.realizado?'text-decoration:line-through':''}">${t.e} ${p.nome} ${realBadge}${linkBadge}</div><div class="mr-mt">${p.horario?'⏰ '+p.horario+' · ':''}${t.label}</div>`;
    if(p.observacao){
      const ob=document.createElement('div');ob.className='mr-obs';ob.textContent='💬 '+p.observacao;info.appendChild(ob);
      if(p.observacao.length>60){const tg=document.createElement('span');tg.className='p-tog';tg.textContent='ver mais ▾';tg.onclick=()=>{const op=ob.classList.toggle('open');tg.textContent=op?'ver menos ▴':'ver mais ▾';};info.appendChild(tg);}
    }
    const url=hasLink?p.gmaps_link:`https://www.google.com/maps/search/?api=1&query=${encodeURIComponent((p.endereco||p.nome)+', Portugal')}`;
    const lk=document.createElement('a');lk.className='btn-gm';lk.href=url;lk.target='_blank';lk.rel='noopener';
    lk.innerHTML=hasLink?'📍 Abrir no Maps':'🔍 Buscar no Maps';info.appendChild(lk);
    item.appendChild(info);lista.appendChild(item);
  });
  el.appendChild(lista);

  // ── GEOCODIFICAÇÃO — apenas paradas NÃO realizadas ──
  if(!parsMap.length){
    $('mst').style.display='block';
    $('mst').textContent='✅ Todas as paradas já foram realizadas';
    setTimeout(()=>{ $('mst').style.display='none'; },3000);
    return;
  }

  $('mst').style.display='block';
  $('mst').textContent=`🔍 Localizando ${parsMap.length} parada${parsMap.length!==1?'s':''} no mapa...`;

  // tenta inferir país/região pelo nome do dia (heurística simples)
  const tituloLower=(dia.titulo||'').toLowerCase();
  const ehBrasil=/brasil|brazil|campinas|viracopos|são paulo|rio|brasília|bh|fortaleza|manaus|salvador/.test(tituloLower);
  const pais=ehBrasil?'Brasil':'Portugal';
  const countrycodes=ehBrasil?'br':'pt';

  // tenta extrair cidade do título do dia para usar como contexto de busca
  // ex: "Dia 2 · Alfama & Belém" → "Lisboa"; "Dia 3 · Sintra" → "Sintra"
  const cidadeMap={
    'alfama':'Lisboa','belém':'Lisboa','lisboa':'Lisboa','sintra':'Sintra',
    'cascais':'Cascais','évora':'Évora','evora':'Évora','porto':'Porto',
    'alentejo':'Alentejo','funchal':'Funchal','madeira':'Funchal',
    'óbidos':'Óbidos','obidos':'Óbidos','nazaré':'Nazaré','nazare':'Nazaré',
    'esporão':'Reguengos de Monsaraz','aveiro':'Aveiro','coimbra':'Coimbra',
    'braga':'Braga','guimarães':'Guimarães','guimaraes':'Guimarães',
    'viracopos':'Campinas','campinas':'Campinas',
  };
  let cidadeCtx='';
  for(const [k,v] of Object.entries(cidadeMap)){
    if(tituloLower.includes(k)){cidadeCtx=v;break;}
  }

  const coords=[];
  for(let i=0;i<parsMap.length;i++){
    const p=parsMap[i];

    // 1ª prioridade: extrair coords direto da URL (links não-encurtados)
    const directCoords=extractCoordsFromGmaps(p.gmaps_link);
    if(directCoords){
      coords.push({p,lat:directCoords.lat,lng:directCoords.lng,ok:true,src:'link'});
      continue;
    }

    // 2ª prioridade: Nominatim estruturado com contexto geográfico
    // monta query: nome + cidade (se inferida) + país
    let q;
    if(p.endereco&&p.endereco.trim()){
      q=p.endereco.trim();
    } else if(cidadeCtx){
      q=`${p.nome}, ${cidadeCtx}, ${pais}`;
    } else {
      q=`${p.nome}, ${pais}`;
    }

    // parâmetros extras para o Nominatim: limita ao país e retorna mais detalhes
    const params=new URLSearchParams({
      format:'json',limit:'3',q,
      countrycodes,
      'accept-language':'pt-BR',
    });

    try{
      const r=await fetch(
        `https://nominatim.openstreetmap.org/search?${params}`,
        {headers:{'User-Agent':'TripCash/1.0'}}
      );
      const d=await r.json();
      if(d.length){
        // se tiver cidade inferida, tenta priorizar resultado que mencione a cidade
        let best=d[0];
        if(cidadeCtx&&d.length>1){
          const match=d.find(r=>(r.display_name||'').toLowerCase().includes(cidadeCtx.toLowerCase()));
          if(match)best=match;
        }
        coords.push({p,lat:+best.lat,lng:+best.lon,ok:true,src:'nominatim'});
      } else {
        // retry só com nome + país, sem cidade
        const params2=new URLSearchParams({format:'json',limit:'1',q:`${p.nome}, ${pais}`,countrycodes,'accept-language':'pt-BR'});
        const r2=await fetch(`https://nominatim.openstreetmap.org/search?${params2}`,{headers:{'User-Agent':'TripCash/1.0'}});
        const d2=await r2.json();
        coords.push(d2.length?{p,lat:+d2[0].lat,lng:+d2[0].lon,ok:true,src:'nominatim-fallback'}:{p,ok:false,src:'fail'});
      }
    }catch{coords.push({p,ok:false,src:'fail'});}

    if(i<parsMap.length-1)await new Promise(r=>setTimeout(r,400));
  }

  $('mst').style.display='none';
  const found=coords.filter(c=>c.ok);
  if(!found.length){
    $('mst').style.display='block';
    $('mst').textContent='📍 Não foi possível localizar as paradas no mapa';
    setTimeout(()=>{ $('mst').style.display='none'; },3000);
    return;
  }

  const lls=[];
  // numeração no mapa = posição na lista original (mantém consistência com a lista)
  found.forEach((c,i)=>{
    const t=TIPOS.find(x=>x.id===c.p.tipo)||TIPOS[5];
    const listIdx=pars.findIndex(p=>p.id===c.p.id);
    const num=listIdx>=0?listIdx+1:i+1;
    const cor=PC[listIdx>=0?listIdx%PC.length:i%PC.length];
    const icon=L.divIcon({
      html:`<div style="width:28px;height:28px;background:${cor};border-radius:50% 50% 50% 0;transform:rotate(-45deg);display:flex;align-items:center;justify-content:center;border:2px solid rgba(255,255,255,.8);box-shadow:0 2px 8px rgba(0,0,0,.5)"><span style="transform:rotate(45deg);font-size:11px;font-weight:700;color:#fff">${num}</span></div>`,
      iconSize:[28,28],iconAnchor:[14,28],popupAnchor:[0,-30],className:''
    });
    const mk=L.marker([c.lat,c.lng],{icon}).addTo(lmap);
    mk.bindPopup(`<strong>${num}. ${c.p.nome}</strong><br><span style="color:#888;font-size:11px">${t.e} ${t.label}${c.p.horario?' · ⏰ '+c.p.horario:''}</span>`);
    lmks.push(mk);lls.push([c.lat,c.lng]);
  });

  if(lls.length>1)lln=L.polyline(lls,{color:'#4ECDC4',weight:3,opacity:.75,dashArray:'8,5'}).addTo(lmap);
  lmap.fitBounds(L.featureGroup(lmks).getBounds().pad(0.3));
  setTimeout(()=>lmap&&lmap.invalidateSize(),150);
}

      $('fab').classList.toggle('h',t!=='lanc');

function toggleTheme(){
  const light=document.body.classList.toggle('light');
  $('theme-btn').textContent=light?'☀️':'🌙';
  localStorage.setItem('theme',light?'light':'dark');
}
// restaura tema salvo
if(localStorage.getItem('theme')==='light'){
  document.body.classList.add('light');
  document.addEventListener('DOMContentLoaded',()=>{const b=$('theme-btn');if(b)b.textContent='☀️';});
}

// ── TOAST ─────────────────────────────────────────────
function toast(msg,dur=2000){
  const el=$('toast');el.textContent=msg;el.classList.add('show');
  setTimeout(()=>el.classList.remove('show'),dur);
}
