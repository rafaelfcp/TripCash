<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<title>TripCash</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#0F0F1A;--sur:#1A1A2E;--bor:#2A2A3E;
  --txt:#F0EDE8;--mut:#7A7A8C;--teal:#4ECDC4;
  --yel:#FFE66D;--red:#FF6B6B;
  --st:env(safe-area-inset-top,0px);
  --sb:env(safe-area-inset-bottom,0px);
}
html,body{height:100%;background:var(--bg);color:var(--txt);font-family:-apple-system,'SF Pro Text',sans-serif;overflow:hidden}

/* ── APP SHELL ── */
#app{display:flex;flex-direction:column;height:100dvh}

/* ── TOPBAR ── */
.topbar{padding:calc(var(--st) + 12px) 16px 0;background:var(--bg);flex-shrink:0}
.tb-row{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.trip-label{font-size:10px;letter-spacing:3px;color:var(--teal);text-transform:uppercase;margin-bottom:2px}
.trip-name{font-size:20px;font-weight:600;cursor:pointer;display:flex;align-items:center;gap:6px}
.trip-name span.ico{font-size:13px;opacity:.5}
.budget-box{text-align:right;flex-shrink:0}
.budget-lbl{font-size:10px;color:var(--mut)}
.budget-val{font-size:15px;cursor:pointer;font-weight:600;color:var(--txt)}
.prog-wrap{margin-top:10px;background:var(--sur);border-radius:99px;height:7px;overflow:hidden}
.prog-bar{height:100%;border-radius:99px;transition:width .5s,background .3s}
.prog-info{display:flex;justify-content:space-between;margin-top:5px;font-size:11px;color:var(--mut);padding-bottom:10px}
.chip-row{display:flex;gap:6px;flex-wrap:wrap;padding:6px 0 8px}
.vchip{background:var(--sur);border:1px solid var(--bor);border-radius:99px;font-size:11px;padding:3px 10px;cursor:pointer;color:var(--mut)}
.vchip.on{border-color:var(--teal);color:var(--teal)}
.vchip.add{color:var(--teal);border-style:dashed}

/* ── TABS ── */
.tabs{display:flex;gap:3px;padding:0 16px 10px;flex-shrink:0}
.tab{flex:1;background:var(--sur);border:1px solid var(--bor);border-radius:99px;color:var(--mut);font-size:11px;padding:7px 2px;cursor:pointer;text-align:center;transition:all .2s}
.tab.on{background:var(--teal);border-color:var(--teal);color:var(--bg);font-weight:700}

/* ── SCROLL AREA ── */
.page{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:14px 16px calc(var(--sb) + 90px)}
.page.hidden{display:none}

/* ── DASH ── */
.sec-title{font-size:10px;letter-spacing:2px;color:var(--mut);text-transform:uppercase;margin-bottom:8px}
.cat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:18px}
.cat-card{background:var(--sur);border:1px solid var(--bor);border-radius:12px;padding:11px 6px;text-align:center;cursor:pointer}
.cat-card .ico{font-size:20px}
.cat-card .lbl{font-size:9px;color:var(--mut);margin-top:2px;text-transform:uppercase;letter-spacing:1px}
.cat-card .val{font-size:11px;margin-top:2px;font-weight:700}
.stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:18px}
.stat-card{background:var(--sur);border:1px solid var(--bor);border-radius:12px;padding:12px}
.stat-lbl{font-size:9px;color:var(--mut);text-transform:uppercase;letter-spacing:1px;margin-bottom:4px}
.stat-val{font-size:17px;font-weight:700}
.stat-sub{font-size:10px;color:var(--mut);margin-top:2px}
.donut-wrap{display:flex;align-items:center;gap:16px;margin-bottom:18px}
.legend{flex:1}
.leg-row{display:flex;align-items:center;gap:6px;margin-bottom:6px;font-size:11px}
.leg-dot{width:9px;height:9px;border-radius:50%;flex-shrink:0}
.bar-row{display:flex;align-items:center;gap:8px;margin-bottom:7px}
.bar-row .nm{font-size:11px;width:80px;flex-shrink:0}
.bar-track{flex:1;background:var(--sur);border-radius:99px;height:7px;overflow:hidden}
.bar-fill{height:100%;border-radius:99px;transition:width .4s}
.bar-row .am{font-size:11px;width:68px;text-align:right;flex-shrink:0}

/* ── LANCAMENTOS ── */
.list-hdr{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.filt-clr{font-size:11px;color:var(--teal);cursor:pointer}
.gasto-item{background:var(--sur);border:1px solid var(--bor);border-left:3px solid var(--ic,var(--teal));border-radius:10px;padding:11px 12px;display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.g-left{display:flex;align-items:center;gap:9px}
.g-ico{font-size:20px}
.g-desc{font-size:13px;font-weight:500}
.g-meta{font-size:10px;color:var(--mut);margin-top:1px}
.g-right{display:flex;align-items:center;gap:8px;flex-shrink:0}
.g-val{font-size:14px;font-weight:700}
.g-acts{display:flex;gap:4px}
.btn-i{background:none;border:none;font-size:15px;cursor:pointer;padding:2px;line-height:1}

/* ── ROTEIRO ── */
.dia-card{background:var(--sur);border:1px solid var(--bor);border-radius:14px;margin-bottom:12px;overflow:hidden}
.dia-hdr{display:flex;align-items:center;padding:12px 14px;cursor:pointer;gap:8px}
.dia-badge{background:var(--teal);color:var(--bg);border-radius:99px;font-size:9px;font-weight:700;padding:3px 9px;flex-shrink:0}
.dia-tit{font-size:14px;font-weight:600;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dia-dt{font-size:10px;color:var(--mut);flex-shrink:0}
.dia-chev{font-size:10px;color:var(--mut);flex-shrink:0}
.dia-body{padding:0 14px 12px;border-top:1px solid var(--bor)}
.dia-desc-txt{font-size:11px;color:var(--mut);padding:8px 0 6px;line-height:1.5}
.par-item{display:flex;gap:8px;align-items:flex-start;padding:9px 0;border-bottom:1px solid var(--bor)}
.par-item:last-child{border-bottom:none}
.par-linha{display:flex;flex-direction:column;align-items:center;flex-shrink:0}
.par-dot{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:13px}
.par-line{width:2px;flex:1;min-height:12px;background:var(--bor);margin-top:2px}
.par-info{flex:1;min-width:0}
.par-nome{font-size:13px;font-weight:600;line-height:1.3}
.par-nome.done{text-decoration:line-through;opacity:.4}
.par-horario{display:inline-flex;align-items:center;gap:3px;font-size:11px;color:var(--teal);font-weight:600;margin-top:3px;background:color-mix(in srgb,var(--teal) 12%,transparent);padding:2px 7px;border-radius:99px}
.par-end{font-size:10px;color:var(--mut);margin-top:3px}
.par-obs{font-size:11px;color:var(--mut);margin-top:5px;line-height:1.5;background:var(--bg);border-radius:8px;padding:6px 8px;border-left:2px solid var(--bor)}
.par-obs.collapsed{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.par-obs-tog{font-size:10px;color:var(--teal);cursor:pointer;margin-top:3px;display:inline-block;font-weight:600}
.par-btns{display:flex;gap:3px;align-items:center;flex-shrink:0;margin-left:4px}
.chk-btn{width:24px;height:24px;border-radius:50%;border:2px solid var(--bor);background:none;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;transition:all .2s;flex-shrink:0}
.chk-btn.done{background:var(--teal);border-color:var(--teal);color:var(--bg)}
.dia-acts{display:flex;gap:6px;justify-content:flex-end;margin-top:10px;padding-top:8px;border-top:1px solid var(--bor)}
.btn-sm{background:var(--bg);border:1px solid var(--bor);border-radius:8px;color:var(--mut);font-size:11px;padding:6px 11px;cursor:pointer}
.rot-empty{text-align:center;padding:40px 0;color:#333}

/* ── MAPA ── */
#mapa-page{flex:1;display:none;flex-direction:column;overflow:hidden;min-height:0}
#mapa-page.visible{display:flex}
.mapa-dia-scroll{display:flex;gap:6px;padding:12px 16px 8px;overflow-x:auto;flex-shrink:0;-webkit-overflow-scrolling:touch}
.mapa-dia-scroll::-webkit-scrollbar{display:none}
.mapa-dia-btn{flex-shrink:0;background:var(--sur);border:1px solid var(--bor);border-radius:99px;font-size:11px;padding:6px 13px;cursor:pointer;color:var(--mut);white-space:nowrap;transition:all .2s}
.mapa-dia-btn.on{background:var(--teal);border-color:var(--teal);color:var(--bg);font-weight:700}
/* card de rota */
.rota-header{background:var(--sur);border-radius:14px;padding:14px;margin-bottom:12px;border:1px solid var(--bor)}
.rota-titulo{font-size:15px;font-weight:700;margin-bottom:4px}
.rota-sub{font-size:11px;color:var(--mut);margin-bottom:12px}
.btn-rota-completa{width:100%;background:var(--teal);border:none;border-radius:10px;color:var(--bg);font-size:14px;font-weight:700;padding:13px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;text-decoration:none}
.btn-rota-completa:active{opacity:.85}
.par-rota-item{display:flex;align-items:flex-start;gap:10px;padding:10px 0;border-bottom:1px solid var(--bor)}
.par-rota-item:last-child{border-bottom:none}
.par-rota-linha{display:flex;flex-direction:column;align-items:center;flex-shrink:0}
.par-rota-num{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:#fff;flex-shrink:0}
.par-rota-line{width:2px;flex:1;min-height:18px;background:var(--bor);margin-top:3px}
.par-rota-info{flex:1;min-width:0}
.par-rota-nome{font-size:13px;font-weight:600;margin-bottom:2px}
.par-rota-meta{font-size:11px;color:var(--mut);margin-bottom:4px}
.btn-gmaps{display:inline-flex;align-items:center;gap:5px;background:#1A73E8;border:none;border-radius:8px;color:#fff;font-size:11px;font-weight:600;padding:5px 10px;cursor:pointer;text-decoration:none;margin-top:2px}
.btn-gmaps-disabled{display:inline-flex;align-items:center;gap:5px;background:var(--bor);border:none;border-radius:8px;color:var(--mut);font-size:11px;padding:5px 10px;cursor:default}
.mapa-empty{text-align:center;padding:40px 16px;color:#444;font-size:13px}
.par-obs-tag{font-size:11px;color:var(--mut);margin-top:5px;line-height:1.5;background:var(--bg);border-radius:8px;padding:6px 8px;border-left:2px solid var(--bor);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.par-obs-tag.open{display:block}
.par-obs-tog{font-size:10px;color:var(--teal);cursor:pointer;margin-top:2px;display:inline-block;font-weight:600}

/* ── FAB ── */
.fab{position:fixed;bottom:calc(var(--sb)+22px);left:50%;transform:translateX(-50%);background:var(--teal);border:none;border-radius:99px;color:var(--bg);font-size:14px;font-weight:700;padding:13px 28px;cursor:pointer;box-shadow:0 4px 20px rgba(78,205,196,.4);display:flex;align-items:center;gap:6px;white-space:nowrap;z-index:100}
.fab.hidden{display:none}

/* ── MODAIS ── */
.mover{display:none;position:fixed;inset:0;background:rgba(0,0,0,.65);z-index:200;align-items:flex-end;justify-content:center}
.mover.open{display:flex}
.msheet{background:var(--sur);border-radius:20px 20px 0 0;padding:18px 16px calc(var(--sb)+22px);width:100%;max-height:92dvh;overflow-y:auto;animation:sup .3s ease}
.mhandle{width:34px;height:4px;background:var(--bor);border-radius:99px;margin:0 auto 16px}
.mtitle{font-size:16px;font-weight:600;margin-bottom:14px}
.flabel{font-size:10px;letter-spacing:1.5px;color:var(--mut);display:block;margin-bottom:4px}
.finput{width:100%;background:var(--bg);border:1px solid var(--bor);border-radius:8px;color:var(--txt);font-size:15px;padding:11px 12px;margin-bottom:12px;outline:none;font-family:inherit;-webkit-appearance:none}
.finput:focus{border-color:var(--teal)}
.fgrid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.cat-pills,.tipo-pills{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:12px}
.tipo-pills{display:grid;grid-template-columns:repeat(3,1fr)}
.pill{background:var(--bg);border:1px solid var(--bor);border-radius:99px;color:var(--txt);padding:6px 10px;font-size:11px;cursor:pointer;display:flex;gap:3px;align-items:center;justify-content:center;transition:all .15s}
.pill.on{border-color:var(--pc);background:color-mix(in srgb,var(--pc) 18%,transparent)}
.btn-row{display:flex;gap:8px;margin-top:4px}
.btn-cancel{flex:1;background:var(--bg);border:1px solid var(--bor);border-radius:10px;color:var(--mut);font-size:14px;padding:12px;cursor:pointer}
.btn-ok{flex:2;background:var(--teal);border:none;border-radius:10px;color:var(--bg);font-size:15px;padding:13px;cursor:pointer;font-weight:700}
.btn-ok:disabled{background:#1A2A2A;color:#2A4A4A;cursor:default}
.tog-row{display:flex;align-items:center;justify-content:space-between;background:var(--bg);border:1px solid var(--bor);border-radius:8px;padding:11px 12px;margin-bottom:12px;cursor:pointer}
.tog-sw{width:40px;height:22px;background:var(--bor);border-radius:99px;position:relative;transition:background .2s;flex-shrink:0}
.tog-sw.on{background:var(--teal)}
.tog-sw::after{content:'';position:absolute;width:16px;height:16px;background:#fff;border-radius:50%;top:3px;left:3px;transition:left .2s}
.tog-sw.on::after{left:21px}

/* POPUP CAT */
.cmover{display:none;position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:300;align-items:flex-end;justify-content:center}
.cmover.open{display:flex}
.csheet{background:var(--sur);border-radius:20px 20px 0 0;padding:18px 16px calc(var(--sb)+18px);width:100%;max-height:80dvh;display:flex;flex-direction:column;animation:sup .3s ease}
.csheet-hdr{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.csheet-tot{font-size:12px;color:var(--mut);margin-bottom:12px;padding-bottom:12px;border-bottom:1px solid var(--bor)}
.csheet-list{overflow-y:auto;flex:1}
.citem{background:var(--bg);border:1px solid var(--bor);border-left:3px solid var(--ic,var(--teal));border-radius:10px;padding:11px 12px;display:flex;justify-content:space-between;margin-bottom:7px}

/* CENTER MODAL */
.cmcenter{display:none;position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:400;align-items:center;justify-content:center;padding:20px}
.cmcenter.open{display:flex}
.cmbox{background:var(--sur);border-radius:16px;padding:22px;width:100%;max-width:360px;animation:zin .25s ease}
.cmbox h3{font-size:15px;font-weight:600;margin-bottom:16px}

.toast{position:fixed;bottom:calc(var(--sb)+90px);left:50%;transform:translateX(-50%) translateY(16px);background:var(--sur);border:1px solid var(--bor);border-radius:99px;padding:9px 18px;font-size:12px;opacity:0;transition:all .25s;pointer-events:none;z-index:999;white-space:nowrap}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

@keyframes sup{from{transform:translateY(100%)}to{transform:translateY(0)}}
@keyframes zin{from{opacity:0;transform:scale(.95)}to{opacity:1;transform:none}}
::-webkit-scrollbar{width:3px}
::-webkit-scrollbar-thumb{background:var(--bor);border-radius:99px}
input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none}
input[type=time]::-webkit-date-and-time-value{text-align:left}
</style>
</head>
<body>
<div id="app">
  <!-- TOPBAR -->
  <div class="topbar">
    <div class="tb-row">
      <div>
        <div class="trip-label">Controle de Viagem</div>
        <div class="trip-name" id="trip-name-el">
          <span id="trip-name-txt">—</span><span class="ico">✏️</span>
        </div>
        <div class="chip-row" id="viagem-chips"></div>
      </div>
      <div class="budget-box">
        <div class="budget-lbl">Orçamento</div>
        <div class="budget-val" id="budget-val">—</div>
      </div>
    </div>
    <div class="prog-wrap"><div class="prog-bar" id="prog-bar" style="width:0%"></div></div>
    <div class="prog-info">
      <span>Gasto: <strong id="total-val" style="color:var(--teal)">R$ 0,00</strong></span>
      <span id="rest-val"></span>
    </div>
  </div>

  <!-- TABS -->
  <div class="tabs">
    <div class="tab on" data-tab="dashboard">📊</div>
    <div class="tab" data-tab="lancamentos">📋</div>
    <div class="tab" data-tab="roteiro">🗺️ Roteiro</div>
    <div class="tab" data-tab="mapa">📍 Mapa</div>
  </div>

  <!-- DASHBOARD -->
  <div class="page" id="page-dashboard">
    <div style="margin-bottom:16px">
      <div class="sec-title">por categoria</div>
      <div class="cat-grid" id="cat-grid"></div>
    </div>
    <div class="stat-grid" id="stat-grid"></div>
    <div style="margin-bottom:16px">
      <div class="sec-title">distribuição</div>
      <div class="donut-wrap">
        <svg id="donut" width="110" height="110" viewBox="0 0 110 110"></svg>
        <div class="legend" id="donut-leg"></div>
      </div>
    </div>
    <div>
      <div class="sec-title">por categoria</div>
      <div id="bar-chart"></div>
    </div>
  </div>

  <!-- LANÇAMENTOS -->
  <div class="page hidden" id="page-lancamentos">
    <div class="list-hdr">
      <span id="list-count" style="font-size:11px;color:var(--mut)"></span>
      <span class="filt-clr hidden" id="filt-clr">Limpar ×</span>
    </div>
    <div id="gastos-list"></div>
  </div>

  <!-- ROTEIRO -->
  <div class="page hidden" id="page-roteiro">
    <div id="roteiro-wrap"></div>
  </div>

  <!-- MAPA (layout especial — ocupa tela toda) -->
  <div id="mapa-page">
    <div class="mapa-dia-scroll" id="mapa-dias"></div>
    <div id="map"></div>
    <div class="mapa-leg-scroll" id="mapa-leg"></div>
  </div>

  <button class="fab hidden" id="fab">＋ Adicionar Gasto</button>
</div>

<!-- MODAL GASTO -->
<div class="mover" id="mg-bg">
  <div class="msheet">
    <div class="mhandle"></div>
    <div class="mtitle" id="mg-title">Novo Gasto</div>
    <label class="flabel">DESCRIÇÃO</label>
    <input class="finput" id="f-desc" type="text" placeholder="Ex: Almoço no centro..." autocomplete="off"/>
    <div class="fgrid2">
      <div><label class="flabel">VALOR (R$)</label>
        <input class="finput" id="f-val" type="number" min="0.01" step="0.01" placeholder="0,00" style="color:var(--yel);font-weight:700"/></div>
      <div><label class="flabel">DATA</label>
        <input class="finput" id="f-data" type="date" style="color-scheme:dark"/></div>
    </div>
    <label class="flabel">OBSERVAÇÃO (opcional)</label>
    <input class="finput" id="f-obs" type="text" placeholder="Detalhes..." autocomplete="off"/>
    <label class="flabel">CATEGORIA</label>
    <div class="cat-pills" id="cat-pills"></div>
    <button class="btn-ok" id="btn-ok-gasto" style="width:100%" disabled>Salvar</button>
  </div>
</div>

<!-- MODAL DIA -->
<div class="mover" id="md-bg">
  <div class="msheet">
    <div class="mhandle"></div>
    <div class="mtitle" id="md-title">Novo Dia</div>
    <label class="flabel">TÍTULO DO DIA</label>
    <input class="finput" id="d-tit" type="text" placeholder="Ex: Lisboa — chegada" autocomplete="off"/>
    <div class="fgrid2">
      <div><label class="flabel">Nº DO DIA</label>
        <input class="finput" id="d-num" type="number" min="1" placeholder="1"/></div>
      <div><label class="flabel">DATA</label>
        <input class="finput" id="d-dat" type="date" style="color-scheme:dark"/></div>
    </div>
    <label class="flabel">DESCRIÇÃO (opcional)</label>
    <input class="finput" id="d-dsc" type="text" placeholder="Resumo do dia..." autocomplete="off"/>
    <div class="btn-row">
      <button class="btn-cancel" id="btn-cancel-dia">Cancelar</button>
      <button class="btn-ok" id="btn-ok-dia">Salvar Dia</button>
    </div>
  </div>
</div>

<!-- MODAL PARADA -->
<div class="mover" id="mp-bg">
  <div class="msheet">
    <div class="mhandle"></div>
    <div class="mtitle" id="mp-title">Nova Parada</div>
    <label class="flabel">NOME DO LOCAL</label>
    <input class="finput" id="p-nome" type="text" placeholder="Ex: Torre de Belém" autocomplete="off"/>
    <label class="flabel">TIPO</label>

<script>
// ─────────────────────────────────────────────────────
const CATS=[
  {id:'hospedagem', label:'Hospedagem', emoji:'🏨',cor:'#FF6B6B'},
  {id:'transporte', label:'Transporte', emoji:'✈️',cor:'#4ECDC4'},
  {id:'alimentacao',label:'Alimentação',emoji:'🍽️',cor:'#FFE66D'},
  {id:'passeios',   label:'Passeios',   emoji:'🎡',cor:'#A8E6CF'},
  {id:'compras',    label:'Compras',    emoji:'🛍️',cor:'#FF8B94'},
  {id:'outros',     label:'Outros',     emoji:'📦',cor:'#C3B1E1'},
];
const TIPOS=[
  {id:'hotel',      label:'Hotel',      emoji:'🏨',cor:'#FF6B6B'},
  {id:'restaurante',label:'Restaurante',emoji:'🍽️',cor:'#FFE66D'},
  {id:'atração',    label:'Atração',    emoji:'🎡',cor:'#4ECDC4'},
  {id:'transporte', label:'Transporte', emoji:'✈️',cor:'#A8E6CF'},
  {id:'compras',    label:'Compras',    emoji:'🛍️',cor:'#FF8B94'},
  {id:'outro',      label:'Outro',      emoji:'📍',cor:'#C3B1E1'},
];
const PINCORES=['#FF6B6B','#4ECDC4','#FFE66D','#A8E6CF','#FF8B94','#C3B1E1','#F7DC6F','#82E0AA','#F1948A','#85C1E9'];
const BRL=v=>new Intl.NumberFormat('pt-BR',{style:'currency',currency:'BRL'}).format(v);
const $=id=>document.getElementById(id);

let sb,vid=null,gastos=[],viagens=[];
let filtCat=null,editGastoId=null;
let rDias=[],rParadas=[],diasOpen={};
let diaEditId=null,parEditId=null,diaAtualId=null,realModal=false;
let mapa=null,mMarkers=[],mLine=null;

// ── INIT ─────────────────────────────────────────────
(async()=>{
  sb=supabase.createClient(
    'https://evvvzmnguhgqaopvquhs.supabase.co',
    'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImV2dnZ6bW5ndWhncWFvcHZxdWhzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzkyMTMzODYsImV4cCI6MjA5NDc4OTM4Nn0.FSuRZjedHmJs4QRiCrk_DS1tzEO-tOU3pN8HG15Iw5g'

// ── VIAGENS ──────────────────────────────────────────
async function loadViagens(){
  const{data}=await sb.from('viagens').select('*').order('criado_em',{ascending:false});
  viagens=data||[];
  if(!viagens.length)return;
  vid=viagens[0].id;

}
function renderChips(){
  const el=$('viagem-chips');el.innerHTML='';
  viagens.forEach(v=>{

    c.textContent=v.nome;
    c.addEventListener('click',async()=>{vid=v.id;renderChips();await loadGastos();});

  });
  const a=document.createElement('div');a.className='vchip add';a.textContent='+ nova';

async function novaViagem(){
  const nome=prompt('Nome da viagem:');if(!nome)return;

$('ev-bg').addEventListener('click',e=>{if(e.target===$('ev-bg'))$('ev-bg').classList.remove('open');});
$('btn-ok-ev').addEventListener('click',async()=>{
  const nome=$('ev-nome').value.trim();if(!nome)return;
  const orc=parseFloat($('ev-orc').value)||0;
  const v=viagens.find(x=>x.id===vid);if(!v)return;
  v.nome=nome;v.orcamento=orc;
  $('trip-name-txt').textContent=nome;renderChips();renderTopbar();
  $('ev-bg').classList.remove('open');toast('Viagem atualizada ✓');
  await sb.from('viagens').update({nome,orcamento:orc}).eq('id',vid);
});

// ── GASTOS ────────────────────────────────────────────
async function loadGastos(){
  const v=viagens.find(x=>x.id===vid);if(!v)return;
  $('trip-name-txt').textContent=v.nome;
  const{data}=await sb.from('gastos').select('*').eq('viagem_id',vid).order('data',{ascending:false});
  gastos=data||[];renderAll();
}
function renderAll(){renderTopbar();renderDash();renderList();}

function renderTopbar(){
  const v=viagens.find(x=>x.id===vid);
  const tot=gastos.reduce((s,g)=>s+Number(g.valor),0);
  const orc=v?.orcamento||0;const rest=orc-tot;
  const pct=orc?Math.min(tot/orc*100,100):0;
  const cor=pct>90?'#FF6B6B':pct>70?'#FFE66D':'#4ECDC4';
  $('total-val').textContent=BRL(tot);$('total-val').style.color=cor;
  $('budget-val').textContent=BRL(orc);
  $('rest-val').textContent=rest>=0?`Restam ${BRL(rest)}`:`Excedido ${BRL(-rest)}`;
  $('rest-val').style.color=rest>=0?'#4ECDC4':'#FF6B6B';
  $('prog-bar').style.width=pct+'%';$('prog-bar').style.background=cor;
}

function renderDash(){
  const tot=gastos.reduce((s,g)=>s+Number(g.valor),0);
  const byCat=CATS.map(c=>({...c,tot:gastos.filter(g=>g.categoria===c.id).reduce((s,g)=>s+Number(g.valor),0)}));
  const mx=Math.max(...byCat.map(c=>c.tot),1);
  const grid=$('cat-grid');grid.innerHTML='';
  byCat.forEach(c=>{
    const d=document.createElement('div');d.className='cat-card';
    d.innerHTML=`<div class="ico">${c.emoji}</div><div class="lbl">${c.label}</div>
      <div class="val" style="color:${c.tot?c.cor:'#333'}">${c.tot?BRL(c.tot):'—'}</div>`;
    d.addEventListener('click',()=>openCatModal(c.id));grid.appendChild(d);
  });
  const v=viagens.find(x=>x.id===vid);const orc=v?.orcamento||0;
  const dias=[...new Set(gastos.map(g=>g.data))].length;
  const maior=gastos.length?gastos.reduce((a,b)=>Number(a.valor)>Number(b.valor)?a:b):null;
  $('stat-grid').innerHTML=`
    <div class="stat-card"><div class="stat-lbl">Total Gasto</div><div class="stat-val" style="color:var(--teal)">${BRL(tot)}</div><div class="stat-sub">${orc?Math.round(tot/orc*100)+'% do orçamento':'—'}</div></div>
    <div class="stat-card"><div class="stat-lbl">Lançamentos</div><div class="stat-val">${gastos.length}</div><div class="stat-sub">${dias} dia${dias!==1?'s':''} com gasto</div></div>
    <div class="stat-card"><div class="stat-lbl">Ticket Médio</div><div class="stat-val" style="color:var(--yel)">${gastos.length?BRL(tot/gastos.length):'—'}</div><div class="stat-sub">por lançamento</div></div>
    <div class="stat-card"><div class="stat-lbl">Maior Gasto</div><div class="stat-val" style="color:var(--red)">${maior?BRL(maior.valor):'—'}</div><div class="stat-sub">${maior?maior.descricao.slice(0,18):'—'}</div></div>`;
  buildDonut(byCat,tot);
  const barEl=$('bar-chart');barEl.innerHTML='';
  byCat.filter(c=>c.tot>0).sort((a,b)=>b.tot-a.tot).forEach(c=>{
    const p=mx?c.tot/mx*100:0;
    barEl.innerHTML+=`<div class="bar-row"><div class="nm">${c.emoji} ${c.label}</div>
      <div class="bar-track"><div class="bar-fill" style="width:${p}%;background:${c.cor}"></div></div>
      <div class="am" style="color:${c.cor}">${BRL(c.tot)}</div></div>`;
  });
  if(!byCat.some(c=>c.tot>0))barEl.innerHTML='<div style="color:#333;text-align:center;padding:16px;font-size:13px">Nenhum dado ainda</div>';
}

function buildDonut(byCat,tot){
  const svg=$('donut'),leg=$('donut-leg');svg.innerHTML='';leg.innerHTML='';
  const has=byCat.filter(c=>c.tot>0);
  if(!has.length){svg.innerHTML='<circle cx="55" cy="55" r="38" fill="none" stroke="#2A2A3E" stroke-width="18"/>';return;}
  let angle=-Math.PI/2;const R=38,cx=55,cy=55;
  has.forEach(c=>{
    const sl=tot?c.tot/tot*2*Math.PI:0;
    const x1=cx+R*Math.cos(angle),y1=cy+R*Math.sin(angle);
    const x2=cx+R*Math.cos(angle+sl),y2=cy+R*Math.sin(angle+sl);
    const path=document.createElementNS('http://www.w3.org/2000/svg','path');
    path.setAttribute('d',`M ${cx} ${cy} L ${x1} ${y1} A ${R} ${R} 0 ${sl>Math.PI?1:0} 1 ${x2} ${y2} Z`);
    path.setAttribute('fill',c.cor);svg.appendChild(path);
    const hole=document.createElementNS('http://www.w3.org/2000/svg','circle');
    hole.setAttribute('cx',cx);hole.setAttribute('cy',cy);hole.setAttribute('r',20);hole.setAttribute('fill','#0F0F1A');
    svg.appendChild(hole);angle+=sl;
    const pct=tot?Math.round(c.tot/tot*100):0;
    leg.innerHTML+=`<div class="leg-row"><div class="leg-dot" style="background:${c.cor}"></div>
      <span>${c.emoji} ${c.label}</span><span style="margin-left:auto;color:${c.cor}">${pct}%</span></div>`;
  });
}

// ── CAT MODAL ─────────────────────────────────────────
function openCatModal(catId){
  const c=CATS.find(x=>x.id===catId);
  const itens=gastos.filter(g=>g.categoria===catId).sort((a,b)=>new Date(b.data)-new Date(a.data));
  const totC=itens.reduce((s,g)=>s+Number(g.valor),0);
  const totG=gastos.reduce((s,g)=>s+Number(g.valor),0);
  $('cm-title').innerHTML=`<span>${c.emoji}</span><span>${c.label}</span>`;
  $('cm-tot').innerHTML=`<strong style="color:${c.cor};font-size:18px">${BRL(totC)}</strong>
    <span style="margin-left:8px">${itens.length} lançamento${itens.length!==1?'s':''} · ${totG?Math.round(totC/totG*100):0}% do total</span>`;
  $('cm-list').innerHTML=itens.length?itens.map(g=>{
    const dt=g.data?g.data.split('-').reverse().join('/'):'';
    return `<div class="citem" style="--ic:${c.cor}">
      <div><div style="font-size:13px">${g.descricao}</div>
      <div style="font-size:10px;color:var(--mut);margin-top:1px">${dt}${g.observacao?' · '+g.observacao:''}</div></div>
      <div style="font-size:14px;font-weight:700;color:${c.cor};flex-shrink:0;margin-left:10px">${BRL(Number(g.valor))}</div></div>`;
  }).join(''):`<div style="text-align:center;padding:28px;color:#333">Nenhum gasto aqui ainda</div>`;
  $('cm-bg').classList.add('open');
}
$('cm-close').addEventListener('click',()=>$('cm-bg').classList.remove('open'));
$('cm-bg').addEventListener('click',e=>{if(e.target===$('cm-bg'))$('cm-bg').classList.remove('open');});

// ── LIST ──────────────────────────────────────────────
function renderList(){
  const fl=filtCat?gastos.filter(g=>g.categoria===filtCat):gastos;
  const cat=filtCat?CATS.find(c=>c.id===filtCat):null;
  $('list-count').textContent=cat?`${cat.emoji} ${cat.label} — ${fl.length} lançamento${fl.length!==1?'s':''}`:
    `${fl.length} lançamento${fl.length!==1?'s':''}`;
  $('filt-clr').classList.toggle('hidden',!filtCat);
  const el=$('gastos-list');el.innerHTML='';
  if(!fl.length){el.innerHTML=`<div style="text-align:center;padding:40px 0;color:#333">

  fl.forEach(g=>{
    const c=CATS.find(x=>x.id===g.categoria)||CATS[5];
    const dt=g.data?g.data.split('-').reverse().join('/'):'';
    const d=document.createElement('div');d.className='gasto-item';d.style.setProperty('--ic',c.cor);
    d.innerHTML=`<div class="g-left"><span class="g-ico">${c.emoji}</span>
      <div><div class="g-desc">${g.descricao}</div>
      <div class="g-meta">${dt}${g.observacao?' · '+g.observacao:''}</div></div></div>
      <div class="g-right"><span class="g-val" style="color:${c.cor}">${BRL(Number(g.valor))}</span>
      <div class="g-acts"><button class="btn-i">✏️</button><button class="btn-i">🗑️</button></div></div>`;
    d.querySelectorAll('.btn-i')[0].addEventListener('click',()=>openEditGasto(g.id));
    d.querySelectorAll('.btn-i')[1].addEventListener('click',()=>deleteGasto(g.id));
    el.appendChild(d);
  });
}
$('filt-clr').addEventListener('click',()=>{filtCat=null;renderDash();renderList();});

// ── MODAL GASTO ───────────────────────────────────────
const cpEl=$('cat-pills');
CATS.forEach(c=>{
  const p=document.createElement('div');p.className='pill';p.dataset.id=c.id;
  p.style.setProperty('--pc',c.cor);p.innerHTML=`${c.emoji} ${c.label}`;
  p.addEventListener('click',()=>{document.querySelectorAll('#cat-pills .pill').forEach(x=>x.classList.remove('on'));p.classList.add('on');chkGasto();});
  cpEl.appendChild(p);
});
$('f-data').value=new Date().toISOString().split('T')[0];
document.querySelector('#cat-pills .pill').classList.add('on');
function chkGasto(){$('btn-ok-gasto').disabled=!($('f-desc').value.trim()&&$('f-val').value>0&&document.querySelector('#cat-pills .pill.on'));}
['f-desc','f-val','f-obs'].forEach(id=>$(id).addEventListener('input',chkGasto));
$('fab').addEventListener('click',()=>{
  editGastoId=null;$('mg-title').textContent='Novo Gasto';
  $('f-desc').value='';$('f-val').value='';$('f-obs').value='';
  $('f-data').value=new Date().toISOString().split('T')[0];
  document.querySelectorAll('#cat-pills .pill').forEach(x=>x.classList.remove('on'));
  document.querySelector('#cat-pills .pill').classList.add('on');
  chkGasto();$('mg-bg').classList.add('open');setTimeout(()=>$('f-desc').focus(),100);
});
$('mg-bg').addEventListener('click',e=>{if(e.target===$('mg-bg'))$('mg-bg').classList.remove('open');});
function openEditGasto(id){
  const g=gastos.find(x=>x.id===id);if(!g)return;
  editGastoId=id;$('mg-title').textContent='Editar Gasto';
  $('f-desc').value=g.descricao;$('f-val').value=Number(g.valor);
  $('f-obs').value=g.observacao||'';$('f-data').value=g.data;
  document.querySelectorAll('#cat-pills .pill').forEach(p=>p.classList.toggle('on',p.dataset.id===g.categoria));
  chkGasto();$('mg-bg').classList.add('open');
}
$('btn-ok-gasto').addEventListener('click',async()=>{
  const descricao=$('f-desc').value.trim(),valor=parseFloat($('f-val').value);
  const observacao=$('f-obs').value.trim()||null,data=$('f-data').value;
  const categoria=document.querySelector('#cat-pills .pill.on')?.dataset.id;
  if(!descricao||!valor||!categoria)return;
  if(editGastoId){
    const i=gastos.findIndex(x=>x.id===editGastoId);
    if(i!==-1)gastos[i]={...gastos[i],descricao,valor,observacao,data,categoria};
    renderAll();$('mg-bg').classList.remove('open');toast('Gasto atualizado ✓');
    await sb.from('gastos').update({descricao,valor,observacao,data,categoria}).eq('id',editGastoId);
  }else{
    const tmp='t'+Date.now();
    gastos.unshift({id:tmp,viagem_id:vid,descricao,valor,observacao,data,categoria});
    renderAll();$('mg-bg').classList.remove('open');toast('Gasto adicionado ✓');
    const{data:ins,error}=await sb.from('gastos').insert({viagem_id:vid,descricao,valor,observacao,data,categoria}).select().single();
    if(error){gastos=gastos.filter(g=>g.id!==tmp);renderAll();toast('Erro ⚠️');}
    else{const i=gastos.findIndex(g=>g.id===tmp);if(i!==-1)gastos[i]=ins;}
  }
});
async function deleteGasto(id){
  if(!confirm('Excluir?'))return;
  const bk=[...gastos];gastos=gastos.filter(g=>g.id!==id);renderAll();toast('Excluído ✓');
  const{error}=await sb.from('gastos').delete().eq('id',id);
  if(error){gastos=bk;renderAll();toast('Erro ⚠️');}
}
$('budget-val').addEventListener('click',async()=>{
  const v=viagens.find(x=>x.id===vid);if(!v)return;
  const novo=parseFloat(prompt('Novo orçamento:',v.orcamento)||v.orcamento);
  if(isNaN(novo)||novo<0)return;
  v.orcamento=novo;renderTopbar();toast('Orçamento atualizado ✓');
  await sb.from('viagens').update({orcamento:novo}).eq('id',vid);
});

// ── ROTEIRO ───────────────────────────────────────────
async function loadRoteiro(render=true){
  const{data:dias}=await sb.from('roteiro_dias').select('*').eq('viagem_id',vid).order('numero');
  rDias=dias||[];
  if(rDias.length){
    const{data:pars}=await sb.from('roteiro_paradas').select('*').in('dia_id',rDias.map(d=>d.id)).order('ordem');
    rParadas=pars||[];
  }else rParadas=[];
  if(render) renderRoteiro();
}

function renderRoteiro(){
  const el=$('roteiro-wrap');el.innerHTML='';
  const addBtn=document.createElement('button');
  addBtn.className='btn-sm';
  addBtn.style.cssText='width:100%;margin-bottom:12px;padding:10px;color:var(--teal);border-color:var(--teal);font-size:13px;font-weight:600';
  addBtn.textContent='+ Adicionar Dia';
  addBtn.addEventListener('click',()=>openDiaModal(null));
  el.appendChild(addBtn);
  if(!rDias.length){
    const e=document.createElement('div');e.className='rot-empty';
    e.innerHTML='<div style="font-size:36px;margin-bottom:10px">🗺️</div><div style="font-size:13px">Nenhum dia no roteiro ainda</div>';
    el.appendChild(e);return;
  }
  rDias.forEach(dia=>{
    const paradas=rParadas.filter(p=>p.dia_id===dia.id).sort((a,b)=>a.ordem-b.ordem);
    const aberto=diasOpen[dia.id]!==false;
    const dtFmt=dia.data?new Date(dia.data+'T12:00:00').toLocaleDateString('pt-BR',{weekday:'short',day:'2-digit',month:'short'}):'';
    const card=document.createElement('div');card.className='dia-card';
    const hdr=document.createElement('div');hdr.className='dia-hdr';
    hdr.innerHTML=`<span class="dia-badge">Dia ${dia.numero}</span>
      <span class="dia-tit">${dia.titulo}</span>
      <span class="dia-dt">${dtFmt}</span>
      <span class="dia-chev">${aberto?'▲':'▼'}</span>`;
    hdr.addEventListener('click',()=>{diasOpen[dia.id]=!aberto;renderRoteiro();});
    card.appendChild(hdr);
    if(aberto){
      const body=document.createElement('div');body.className='dia-body';
      if(dia.descricao){
        const dc=document.createElement('div');dc.className='dia-desc-txt';dc.textContent=dia.descricao;body.appendChild(dc);
      }
      // paradas
      const pw=document.createElement('div');
      if(!paradas.length){
        pw.innerHTML='<div style="font-size:11px;color:#444;padding:8px 0">Nenhuma parada — adicione abaixo</div>';
      }else{
        paradas.forEach((p,i)=>{
          const t=TIPOS.find(x=>x.id===p.tipo)||TIPOS[5];
          const row=document.createElement('div');row.className='par-item';
          // linha timeline
          const lh=document.createElement('div');lh.className='par-linha';
          const dot=document.createElement('div');dot.className='par-dot';
          dot.style.cssText=`background:color-mix(in srgb,${t.cor} 18%,transparent);border:2px solid ${t.cor}`;
          dot.textContent=t.emoji;lh.appendChild(dot);
          if(i<paradas.length-1){const ln=document.createElement('div');ln.className='par-line';lh.appendChild(ln);}
          row.appendChild(lh);
          // info
          const info=document.createElement('div');info.className='par-info';
          const nome=document.createElement('div');nome.className='par-nome'+(p.realizado?' done':'');nome.textContent=p.nome;info.appendChild(nome);
          // horário como badge
          if(p.horario){
            const hb=document.createElement('div');hb.className='par-horario';hb.textContent='⏰ '+p.horario;info.appendChild(hb);
          }
          // endereço
          if(p.endereco){
            const en=document.createElement('div');en.className='par-end';en.textContent='📍 '+p.endereco;info.appendChild(en);
          }
          // observação com ver mais/menos
          if(p.observacao){
            const obs=document.createElement('div');obs.className='par-obs collapsed';obs.textContent='💬 '+p.observacao;info.appendChild(obs);
            if(p.observacao.length>55){
              const tog=document.createElement('span');tog.className='par-obs-tog';tog.textContent='ver mais ▾';
              tog.addEventListener('click',e=>{
                e.stopPropagation();
                const col=obs.classList.toggle('collapsed');
                tog.textContent=col?'ver mais ▾':'ver menos ▴';
              });
              info.appendChild(tog);
            }
          }
          row.appendChild(info);
          // botões
          const btns=document.createElement('div');btns.className='par-btns';
          // setas de ordem
          const upBtn=document.createElement('button');upBtn.className='btn-i';upBtn.textContent='▲';
          upBtn.style.cssText='font-size:12px;opacity:'+(i===0?'0.2':'0.8');upBtn.disabled=i===0;
          upBtn.addEventListener('click',()=>moverParada(dia.id,i,-1));btns.appendChild(upBtn);
          const dnBtn=document.createElement('button');dnBtn.className='btn-i';dnBtn.textContent='▼';
          dnBtn.style.cssText='font-size:12px;opacity:'+(i===paradas.length-1?'0.2':'0.8');dnBtn.disabled=i===paradas.length-1;
          dnBtn.addEventListener('click',()=>moverParada(dia.id,i,+1));btns.appendChild(dnBtn);
          const chk=document.createElement('button');chk.className='chk-btn'+(p.realizado?' done':'');
          chk.textContent=p.realizado?'✓':'';
          chk.addEventListener('click',()=>toggleReal(p.id,p.realizado));btns.appendChild(chk);
          const eb=document.createElement('button');eb.className='btn-i';eb.textContent='✏️';
          eb.addEventListener('click',()=>openParModal(dia.id,p.id));btns.appendChild(eb);
          const db=document.createElement('button');db.className='btn-i';db.textContent='🗑️';
          db.addEventListener('click',()=>delParada(p.id));btns.appendChild(db);
          row.appendChild(btns);pw.appendChild(row);
        });
      }
      body.appendChild(pw);
      // ações
      const acts=document.createElement('div');acts.className='dia-acts';
      const bPar=document.createElement('button');bPar.className='btn-sm';
      bPar.style.cssText='color:var(--teal);border-color:var(--teal);font-weight:600';bPar.textContent='+ Parada';
      bPar.addEventListener('click',e=>{e.stopPropagation();openParModal(dia.id,null);});acts.appendChild(bPar);
      const bEd=document.createElement('button');bEd.className='btn-sm';bEd.textContent='✏️ Dia';
      bEd.addEventListener('click',e=>{e.stopPropagation();openDiaModal(dia.id);});acts.appendChild(bEd);
      const bDel=document.createElement('button');bDel.className='btn-sm';bDel.style.color='var(--red)';bDel.textContent='🗑️';
      bDel.addEventListener('click',e=>{e.stopPropagation();delDia(dia.id);});acts.appendChild(bDel);
      body.appendChild(acts);card.appendChild(body);
    }
    el.appendChild(card);
  });
}

async function moverParada(diaId, idx, dir){
  // pega paradas do dia ordenadas
  const idxGlobal = p => rParadas.findIndex(x=>x.id===p.id);
  const paradas = rParadas.filter(p=>p.dia_id===diaId).sort((a,b)=>a.ordem-b.ordem);
  const novoIdx = idx+dir;
  if(novoIdx<0||novoIdx>=paradas.length) return;

  const a = paradas[idx];
  const b = paradas[novoIdx];

  // troca ordens
  const tmpOrdem = a.ordem;
  a.ordem = b.ordem;
  b.ordem = tmpOrdem;

  // atualiza diretamente no array global por referência de id
  const ia = idxGlobal(a);
  const ib = idxGlobal(b);
  if(ia!==-1) rParadas[ia].ordem = a.ordem;
  if(ib!==-1) rParadas[ib].ordem = b.ordem;

  renderRoteiro();

  // persiste no banco
  const [ra,rb] = await Promise.all([
    sb.from('roteiro_paradas').update({ordem:a.ordem}).eq('id',a.id),
    sb.from('roteiro_paradas').update({ordem:b.ordem}).eq('id',b.id),
  ]);
  if(ra.error||rb.error){
    toast('Erro ao salvar ordem ⚠️');
    await loadRoteiro();
  } else {
    toast('Ordem atualizada ✓');
  }
}

async function toggleReal(id,atual){
  const novo=!atual;
  const i=rParadas.findIndex(p=>p.id===id);if(i!==-1)rParadas[i].realizado=novo;
  renderRoteiro();
  await sb.from('roteiro_paradas').update({realizado:novo}).eq('id',id);
}

// ── MODAL DIA ─────────────────────────────────────────
function openDiaModal(id){
  diaEditId=id;const dia=id?rDias.find(d=>d.id===id):null;
  $('md-title').textContent=dia?'Editar Dia':'Novo Dia';
  $('d-tit').value=dia?.titulo||'';$('d-num').value=dia?.numero||(rDias.length+1);
  $('d-dat').value=dia?.data||'';$('d-dsc').value=dia?.descricao||'';
  $('md-bg').classList.add('open');setTimeout(()=>$('d-tit').focus(),100);
}
$('btn-cancel-dia').addEventListener('click',()=>$('md-bg').classList.remove('open'));
$('md-bg').addEventListener('click',e=>{if(e.target===$('md-bg'))$('md-bg').classList.remove('open');});
$('btn-ok-dia').addEventListener('click',async()=>{
  const titulo=$('d-tit').value.trim();if(!titulo)return;
  const numero=parseInt($('d-num').value)||1;
  const data=$('d-dat').value||null,descricao=$('d-dsc').value.trim()||null;
  $('md-bg').classList.remove('open');
  if(diaEditId){
    const i=rDias.findIndex(d=>d.id===diaEditId);

    renderRoteiro();toast('Dia atualizado ✓');
    await sb.from('roteiro_dias').update({titulo,numero,data,descricao}).eq('id',diaEditId);
  }else{
    const tmp='t'+Date.now();
    rDias.push({id:tmp,viagem_id:vid,titulo,numero,data,descricao});
    rDias.sort((a,b)=>a.numero-b.numero);renderRoteiro();toast('Dia adicionado ✓');
    const{data:ins,error}=await sb.from('roteiro_dias').insert({viagem_id:vid,titulo,numero,data,descricao}).select().single();
    if(error){rDias=rDias.filter(d=>d.id!==tmp);renderRoteiro();toast('Erro ⚠️');}
    else{const i=rDias.findIndex(d=>d.id===tmp);if(i!==-1){rDias[i]=ins;renderRoteiro();}}

async function delDia(id){
  if(!confirm('Excluir este dia e todas as paradas?'))return;
  rDias=rDias.filter(d=>d.id!==id);rParadas=rParadas.filter(p=>p.dia_id!==id);
  renderRoteiro();toast('Dia excluído ✓');
  await sb.from('roteiro_dias').delete().eq('id',id);
}

// ── MODAL PARADA ──────────────────────────────────────
const tpEl=$('tipo-pills');
TIPOS.forEach(t=>{
  const p=document.createElement('div');p.className='pill';p.dataset.id=t.id;
  p.style.setProperty('--pc',t.cor);p.innerHTML=`${t.emoji} ${t.label}`;

document.querySelector('#tipo-pills .pill').classList.add('on');
$('real-tog').addEventListener('click',()=>{realModal=!realModal;$('real-sw').classList.toggle('on',realModal);});

  diaAtualId=diaId;parEditId=parId||null;

$('btn-cancel-par').addEventListener('click',()=>$('mp-bg').classList.remove('open'));
$('mp-bg').addEventListener('click',e=>{if(e.target===$('mp-bg'))$('mp-bg').classList.remove('open');});
$('btn-ok-par').addEventListener('click',async()=>{
  const nome=$('p-nome').value.trim();if(!nome)return;
  const horario=$('p-hor').value||null,endereco=$('p-end').value.trim()||null;
  const observacao=$('p-obs').value.trim()||null,realizado=realModal;
  const gmaps_link=$('p-gmaps').value.trim()||null;
  const tipo=document.querySelector('#tipo-pills .pill.on')?.dataset.id||'outro';
  const ordem=rParadas.filter(p=>p.dia_id===diaAtualId).length+1;
  $('mp-bg').classList.remove('open');
  if(parEditId){
    const i=rParadas.findIndex(p=>p.id===parEditId);
    if(i!==-1)rParadas[i]={...rParadas[i],nome,horario,endereco,observacao,tipo,realizado,gmaps_link};
    renderRoteiro();toast('Parada atualizada ✓');
    await sb.from('roteiro_paradas').update({nome,horario,endereco,observacao,tipo,realizado,gmaps_link}).eq('id',parEditId);
  }else{
    const tmp='t'+Date.now();
    rParadas.push({id:tmp,dia_id:diaAtualId,nome,horario,endereco,observacao,tipo,realizado,gmaps_link,ordem});
    renderRoteiro();toast('Parada adicionada ✓');
    const{data:ins,error}=await sb.from('roteiro_paradas').insert({dia_id:diaAtualId,nome,horario,endereco,observacao,tipo,realizado,gmaps_link,ordem}).select().single();
    if(error){rParadas=rParadas.filter(p=>p.id!==tmp);renderRoteiro();toast('Erro ⚠️');}

async function delParada(id){
  if(!confirm('Excluir esta parada?'))return;
  rParadas=rParadas.filter(p=>p.id!==id);renderRoteiro();toast('Parada excluída ✓');
  await sb.from('roteiro_paradas').delete().eq('id',id);
}

// ── MAPA / ROTA ───────────────────────────────────────
async function initMapa(){
  // sempre recarrega roteiro ao abrir o mapa
  await loadRoteiro();
  renderMapaDias();
  if(rDias.length) renderRotaDia(rDias[0]);
  else $('mapa-content').innerHTML='<div class="mapa-empty">🗺️<br><br>Nenhum dia no roteiro ainda</div>';
}

function renderMapaDias(){
  const wrap=$('mapa-dias');wrap.innerHTML='';
  rDias.forEach((dia,idx)=>{
    const btn=document.createElement('div');
    btn.className='mapa-dia-btn'+(idx===0?' on':'');
    btn.textContent=`Dia ${dia.numero} · ${dia.titulo.split('—')[0].split('&')[0].trim().slice(0,20)}`;
    btn.addEventListener('click',()=>{
      document.querySelectorAll('.mapa-dia-btn').forEach(b=>b.classList.remove('on'));
      btn.classList.add('on');renderRotaDia(dia);
    });
    wrap.appendChild(btn);
  });
}

function buildGMapsRotaURL(paradas){
  // Monta URL de rota do Google Maps com waypoints
  const comLink = paradas.filter(p=>p.gmaps_link||p.endereco||p.nome);
  if(!comLink.length) return null;

  // Se tiver link curto do Google Maps (maps.app.goo.gl), abre direto
  // Se tiver múltiplos, monta rota via /dir/
  const destinos = comLink.map(p=>{
    if(p.gmaps_link && p.gmaps_link.includes('maps.app.goo.gl')){
      return null; // links curtos não compõem rotas — usamos nome
    }
    return encodeURIComponent(p.endereco||p.nome+', Portugal');
  });

  if(comLink.length===1){
    if(comLink[0].gmaps_link) return comLink[0].gmaps_link;
    return `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(comLink[0].endereco||comLink[0].nome+', Portugal')}`;
  }

  // rota completa: origin/waypoints/destination
  const origin=destinos[0];
  const dest=destinos[destinos.length-1];
  const waypts=destinos.slice(1,-1).filter(Boolean).join('|');
  return `https://www.google.com/maps/dir/${destinos.filter(Boolean).join('/')}`;
}

function renderRotaDia(dia){
  const paradas=rParadas.filter(p=>p.dia_id===dia.id).sort((a,b)=>a.ordem-b.ordem);
  const el=$('mapa-content');el.innerHTML='';
  const dtFmt=dia.data?new Date(dia.data+'T12:00').toLocaleDateString('pt-BR',{weekday:'long',day:'2-digit',month:'long'}):'';

  if(!paradas.length){
    el.innerHTML=`<div class="mapa-empty">🗺️<br><br>Nenhuma parada no Dia ${dia.numero}<br><span style="font-size:11px;color:#333">Adicione paradas no Roteiro</span></div>`;
    return;
  }

  // ── Header com botão de rota completa ──
  const header=document.createElement('div');header.className='rota-header';
  const rotaURL=buildGMapsRotaURL(paradas);
  const comGmaps=paradas.filter(p=>p.gmaps_link||p.endereco).length;
  header.innerHTML=`
    <div class="rota-titulo">Dia ${dia.numero} · ${dia.titulo}</div>
    <div class="rota-sub">${dtFmt} · ${paradas.length} parada${paradas.length!==1?'s':''} · ${comGmaps} com localização</div>`;
  if(rotaURL){
    const btn=document.createElement('a');btn.className='btn-rota-completa';
    btn.href=rotaURL;btn.target='_blank';btn.rel='noopener';
    btn.innerHTML='🗺️ Abrir rota completa no Google Maps';
    header.appendChild(btn);
  }else{
    const aviso=document.createElement('div');
    aviso.style.cssText='font-size:11px;color:var(--mut);text-align:center;padding:10px;background:var(--bg);border-radius:8px';
    aviso.textContent='Adicione links do Google Maps nas paradas para ativar a rota';
    header.appendChild(aviso);
  }
  el.appendChild(header);

  // ── Lista de paradas com botão individual ──
  const lista=document.createElement('div');
  lista.style.cssText='background:var(--sur);border:1px solid var(--bor);border-radius:14px;padding:4px 14px';
  paradas.forEach((p,i)=>{
    const t=TIPOS.find(x=>x.id===p.tipo)||TIPOS[5];
    const cor=PINCORES[i%PINCORES.length];
    const item=document.createElement('div');item.className='par-rota-item';

    // linha timeline
    const lh=document.createElement('div');lh.className='par-rota-linha';
    const num=document.createElement('div');num.className='par-rota-num';
    num.style.background=cor;num.textContent=i+1;lh.appendChild(num);
    if(i<paradas.length-1){const ln=document.createElement('div');ln.className='par-rota-line';lh.appendChild(ln);}
    item.appendChild(lh);

    // info
    const info=document.createElement('div');info.className='par-rota-info';
    info.innerHTML=`<div class="par-rota-nome">${t.emoji} ${p.nome}${p.realizado?' <span style="color:var(--teal);font-size:11px">✓ realizado</span>':''}</div>
      <div class="par-rota-meta">${p.horario?'⏰ '+p.horario+' · ':''}${t.label}</div>`;

    // observação
    if(p.observacao){
      const obs=document.createElement('div');obs.className='par-obs-tag';obs.textContent='💬 '+p.observacao;info.appendChild(obs);
      if(p.observacao.length>60){
        const tog=document.createElement('span');tog.className='par-obs-tog';tog.textContent='ver mais ▾';
        tog.addEventListener('click',()=>{
          const open=obs.classList.toggle('open');tog.textContent=open?'ver menos ▴':'ver mais ▾';
        });
        info.appendChild(tog);
      }
    }

    // botão Google Maps individual
    if(p.gmaps_link||p.endereco||p.nome){
      const url=p.gmaps_link||(
        p.endereco
          ?`https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(p.endereco)}`
          :`https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(p.nome+', Portugal')}`
      );
      const link=document.createElement('a');link.className='btn-gmaps';
      link.href=url;link.target='_blank';link.rel='noopener';
      link.innerHTML='📍 Ver no Maps';
      info.appendChild(link);
    }else{
      const na=document.createElement('span');na.className='btn-gmaps-disabled';na.innerHTML='📍 Sem localização';
      info.appendChild(na);
    }

    item.appendChild(info);lista.appendChild(item);
  });
  el.appendChild(lista);
}

// ── TABS ──────────────────────────────────────────────
const pages=['dashboard','lancamentos','roteiro'];
document.querySelectorAll('.tab').forEach(tab=>{
  tab.addEventListener('click',()=>{
    document.querySelectorAll('.tab').forEach(t=>t.classList.remove('on'));tab.classList.add('on');
    const id=tab.dataset.tab;
    // páginas normais
    pages.forEach(p=>{
      const el=$(`page-${p}`);
      if(el)el.classList.toggle('hidden',p!==id);
    });
    // mapa tem layout especial
    const mapaPage=$('mapa-page');
    if(id==='mapa'){
      mapaPage.classList.add('visible');
      $('fab').classList.add('hidden');
      initMapa();
    }else{
      mapaPage.classList.remove('visible');
      $('fab').classList.toggle('hidden',id!=='lancamentos');
      if(id==='roteiro')loadRoteiro();
    }
  });
});

// ── TOAST ─────────────────────────────────────────────
function toast(msg,dur=2000){
  const el=$('toast');el.textContent=msg;el.classList.add('show');
  setTimeout(()=>el.classList.remove('show'),dur);
}
